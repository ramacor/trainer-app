<!doctype html>
<!-- Trainer-app -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#F4F5F8;--surface:#FFFFFF;--surface2:#EBEDF2;--line:#E1E4EB;--ink:#1B1E27;--ink2:#5B6172;--ink3:#9AA0B1;
--accent:#6C56E0;--q:#6C56E0;--q-bg:#EEEAFD;--e:#0E8A6B;--e-bg:#DFF3EC;--s:#B4740A;--s-bg:#F7EFDC;
--green:#12866B;--green-bg:#DFF3EC;--amber:#B4740A;--amber-bg:#F7EFDC;--red:#C24E38;--red-bg:#F4D8D0;
--shadow:0 1px 3px rgba(20,22,30,.06),0 4px 16px rgba(20,22,30,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--surface:#101218;--surface2:#1A1D25;--line:#23262F;--ink:#E9EBF2;--ink2:#9CA3B5;--ink3:#5F6575;
--accent:#7C67F2;--q:#A493FF;--q-bg:#1D1936;--e:#35C79B;--e-bg:#0F271F;--s:#E5A63E;--s-bg:#2A2113;--green:#41D9AE;--green-bg:#0F4437;--amber:#E5A63E;--amber-bg:#3D2D12;--red:#F09B84;--red-bg:#47231B;--shadow:none}}
:root[data-theme="dark"]{--bg:#000;--surface:#101218;--surface2:#1A1D25;--line:#23262F;--ink:#E9EBF2;--ink2:#9CA3B5;--ink3:#5F6575;
--accent:#7C67F2;--q:#A493FF;--q-bg:#1D1936;--e:#35C79B;--e-bg:#0F271F;--s:#E5A63E;--s-bg:#2A2113;--green:#41D9AE;--green-bg:#0F4437;--amber:#E5A63E;--amber-bg:#3D2D12;--red:#F09B84;--red-bg:#47231B;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;height:100%}
#app{display:flex;flex-direction:column;height:100dvh}
.timeline{padding:calc(env(safe-area-inset-top) + 8px) 16px 4px;background:var(--bg)}
.tl{position:relative;height:5px;border-radius:3px;background:var(--surface2);margin:10px 14px 0 4px}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--q))}
.tl em{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--q-bg)}
.tl b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink3);opacity:.3}
.tl s{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:13px;line-height:1;text-decoration:none;color:var(--ink3)}
.tl s.next{color:var(--accent);font-size:16px}.tl s.done{color:var(--green)}
.tl .brk{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);overflow:visible}
.timeline .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:8px}.timeline .lbl .goal{color:var(--accent);font-weight:700}
.screen{flex:1;overflow-y:auto;padding:4px 16px calc(65px + env(safe-area-inset-bottom))}
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}
.hdr h1{font-size:30px;margin:0;letter-spacing:-.3px}.hdr h1 small{font-size:inherit;font-weight:inherit;color:inherit}.hdr .d{color:var(--ink2);font-size:13px}
.gear{font-size:20px;color:var(--ink2);cursor:pointer}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin:0 0 12px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;font-weight:700}
.card h2 .n{text-transform:none;letter-spacing:0;font-weight:400}
.muted{color:var(--ink2);font-size:13px}.small{font-size:12px;color:var(--ink3)}
.dec{border-radius:12px;padding:9px 12px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.dec.GREEN{background:var(--green-bg);color:var(--green)}.dec.AMBER{background:var(--amber-bg);color:var(--amber)}.dec.RED{background:var(--red-bg);color:var(--red)}.dec.NO_DATA{background:var(--surface2);color:var(--ink2)}
.dec .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:0 0 auto}.dec b{font-size:14px;font-weight:800}.dec span{font-size:13px;opacity:.9;flex:1}
.focus{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;margin:0 0 12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.focus img{width:34px;height:34px;object-fit:contain}.focus img.gr{object-fit:cover;border-radius:6px}.focus b{display:block;font-size:15px}.focus span{font-size:12.5px;color:var(--ink2)}.focus em{font-style:normal;color:var(--accent);font-size:18px}
.trk{margin:0;padding:0;list-style:none}
.trk li{display:grid;grid-template-columns:18px 1fr auto auto;gap:8px;align-items:center;padding:7px 8px;margin:0 -8px;min-height:36px;border-radius:8px}
.trk li+li{margin-top:2px}.trk li.ok{background:var(--green-bg)}.trk li.warn{background:var(--amber-bg)}.trk li.bad{background:var(--red-bg)}.trk li.na{background:var(--surface2)}
.trk .n{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk .n span{font-size:11px;color:var(--ink3);margin-left:4px}
.trk .v{display:grid;grid-template-columns:58px 30px;gap:4px;align-items:baseline;font-size:15px;font-weight:700;white-space:nowrap}.trk .v .num{text-align:right}.trk .v small{font-size:10.5px;font-weight:500;color:var(--ink3);text-align:left}
.trk .dl{font-size:11.5px;font-weight:600;min-width:44px;text-align:right;white-space:nowrap;color:var(--ink2)}.trk .dl.up{color:var(--green)}.trk .dl.dn{color:var(--red)}.trk .dl.no{color:var(--amber)}.trk .dl.ok{color:var(--green)}
.src{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.src.oura{color:var(--ink)}.src.oura svg{display:block}
.src.garmin{background:#1F6FD6;clip-path:polygon(50% 8%,96% 92%,4% 92%)}
.src.self{color:var(--ink)}.src.self svg{display:block}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:12px 0 4px}.grp:first-child{padding-top:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.q{background:var(--q-bg);color:var(--q)}.pill.e{background:var(--e-bg);color:var(--e)}.pill.s{background:var(--s-bg);color:var(--s)}.pill.ok{background:var(--green-bg);color:var(--green)}.pill.warn{background:var(--amber-bg);color:var(--amber)}.pill.r{background:var(--surface2);color:var(--ink2)}
.seg{display:flex;gap:4px;margin-top:6px}.seg span{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}.seg span.on{background:var(--accent);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}.btn.ghost{background:var(--surface2);color:var(--ink)}.btn:disabled{opacity:.6}
.list{margin:0;padding:0;list-style:none}.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.list li:first-child{border-top:0}.list li.tap{cursor:pointer}
.day{width:44px;text-align:center}.day b{display:block;font-size:17px}.day span{font-size:11px;color:var(--ink3);text-transform:uppercase}
.li-main{flex:1;min-width:0}.li-main b{display:block;font-size:14.5px}.li-main span{font-size:12.5px;color:var(--ink2)}.li-r{text-align:right;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips span{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);cursor:pointer}.chips span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tabs{height:auto;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tabs div{flex:1;text-align:center;font-size:10.5px;color:var(--ink3);cursor:pointer}.tabs div svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tabs div.on{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;width:100%;border-top:1px solid var(--line)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.modal h3{font-size:18px;margin:4px 0 2px}.modal .meta{color:var(--ink2);font-size:12.5px;margin:0 0 10px}.modal h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 4px;font-weight:700}
.modal p{font-size:14px;line-height:1.5;margin:0}.modal ul{margin:0;padding:0 0 0 16px;font-size:13.5px;line-height:1.5}
.wtab{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:6px}
.wtab td{padding:5px 6px;vertical-align:top;border-top:1px solid var(--line);line-height:1.4}.wtab tr:first-child td{border-top:0}
.wtab td.r{width:30px;text-align:right;color:var(--accent);font-weight:700;white-space:nowrap}.wtab td.t{width:70px;white-space:nowrap;font-weight:600}.wtab td.d{width:48px;text-align:right;white-space:nowrap}.wtab td.z{white-space:nowrap}.wtab td.n{color:var(--ink2)}
.wtab tr.rep td{background:var(--q-bg)}.wtab tr.rep td.r{box-shadow:inset 3px 0 var(--accent)}.wtab tr.cont td{border-top:0}.wtab tr.mid td{color:var(--amber)}
.coach.hl{background:var(--q-bg);border:1.5px solid var(--accent);box-shadow:var(--shadow)}.coach.hl h2{color:var(--accent);font-size:13px}.coach.hl p{font-size:15px;line-height:1.55;color:var(--ink)}.coach.hl .small{color:var(--ink2)}
.coach p{font-size:13.5px;line-height:1.5;margin:0 0 6px}.coach b.t{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:8px 0 2px}
textarea.inp{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:14px/1.5 -apple-system,system-ui,sans-serif;padding:10px;resize:none}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.setrow:first-child{border-top:0}.setrow b{font-weight:600;font-size:15px;display:block}.setrow span{font-size:12.5px;color:var(--ink2)}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--accent);position:relative;display:inline-block;cursor:pointer;flex:0 0 auto}.toggle::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.toggle.off{background:var(--surface2)}.toggle.off::after{right:auto;left:3px;background:var(--ink3)}
.goal3{display:flex;flex-direction:column;gap:8px}.goal3 .g{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px}
.goal3 .g img{width:56px;height:40px;object-fit:contain;display:block}.goal3 .g img.gr{object-fit:cover;border-radius:8px}.goal3 .g b{display:block;font-size:14.5px}.goal3 .g span{font-size:12px;color:var(--ink2)}.goal3 .g .d{font-size:12px;color:var(--ink3);text-align:right;white-space:nowrap}
.lg-dark{display:none}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-light{display:none}:root:not([data-theme="light"]) .lg-dark{display:block}}:root[data-theme="dark"] .lg-light{display:none}:root[data-theme="dark"] .lg-dark{display:block}
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.phase div{background:var(--surface2);border-radius:10px;padding:8px;font-size:11.5px;color:var(--ink2)}.phase div b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.ms{margin:0;padding:0;list-style:none}.ms li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.ms li:first-child{border-top:0}
.ms .wk{font-size:11px;color:var(--ink3);text-transform:uppercase;font-weight:700}.ms .wk b{display:block;font-size:15px;color:var(--ink)}.ms .t{font-size:14px}.ms .t span{display:block;font-size:12px;color:var(--ink2)}
.ms li.now{background:var(--q-bg);margin:0 -8px;padding:8px;border-radius:8px;border-top:0}.ms li.now+li{border-top:0}.ms li.done .t{color:var(--ink3)}
svg.chart{width:100%;height:130px;display:block}.legend{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.dayhdr{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 6px}.dayhdr b{font-size:15px}.dayhdr span{font-size:12px;color:var(--ink3)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chk span{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2)}.chk span.y{background:var(--green-bg);color:var(--green)}.chk span.n{background:var(--red-bg);color:var(--red)}
.advice{background:var(--surface2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-top:8px}.advice b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.setup{padding:40px 24px}.setup input{width:100%;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:.05em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}.toast.on{opacity:1}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="box"><div class="grab"></div><div id="mbody"></div><button class="btn ghost" onclick="closeModal()">Sluiten</button></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const SYNC_URL = 'https://duhynxczceeqixyocaqr.supabase.co/functions/v1/pt';
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set:(k,v)=>{ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} } };
let CODE = LS.get('pt_code', ''); let D = LS.get('pt_snapshot', null); let TAB = LS.get('pt_tab', 'vandaag');
const ICON_OURA = '<i class="src oura"><svg viewBox="0 0 40 40" width="16" height="16"><rect x="13" y="3" width="14" height="4" rx="1" fill="currentColor"/><circle cx="20" cy="24" r="12.5" fill="none" stroke="currentColor" stroke-width="4"/></svg></i>';
const ICON_GARMIN = '<i class="src garmin"></i>';
const ICON_SELF = '<i class="src self"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></i>';
const SRC = { oura: ICON_OURA, garmin: ICON_GARMIN, self: ICON_SELF };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = (x, nd=1) => x==null ? '–' : Number(x).toLocaleString('nl-NL', {minimumFractionDigits:nd, maximumFractionDigits:nd});
const dur = s => { s=Math.round(s||0); const m=Math.floor(s/60), r=s%60; return s>=3600 ? `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`; };
const mmss = s => { s=Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 2200); }

// ---------------------------------------------------------------- data
async function api(method, path, body){ const r = await fetch(SYNC_URL+path, {method, headers:{'x-sync-code':CODE,'content-type':'application/json'}, body: body?JSON.stringify(body):undefined}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function load(){
  if(!CODE){ renderSetup(); return; }
  render();
  try{ const r = await api('GET','/state'); if(r && r.payload){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); render(); } else if(!D){ renderSetup('Nog geen snapshot voor deze synccode. Draai de dagelijkse ronde op de Mac.'); } }
  catch(e){ if(!D) renderSetup('Kan de server niet bereiken: '+e.message); else toast('Offline: laatste snapshot getoond'); }
}
function renderSetup(msg){ document.getElementById('app').innerHTML = `<div class="setup"><h1 style="font-size:28px;margin:0 0 6px">Trainer</h1><p class="muted">Vul de synccode in die op de Mac in config/app_sync.json staat. De code is het enige geheim; uw gegevens staan achter die code.</p>${msg?`<p class="muted" style="color:var(--red)">${esc(msg)}</p>`:''}<input id="code" placeholder="PT-XXXX-XXXX-XXXX" value="${esc(CODE)}"><button class="btn" onclick="saveCode()">Verbinden</button></div>`; }
function saveCode(){ CODE = document.getElementById('code').value.trim().toUpperCase(); LS.set('pt_code', CODE); load(); }

// ---------------------------------------------------------------- shell
function render(){
  if(!D){ document.getElementById('app').innerHTML = '<div class="setup"><p class="muted">Laden…</p></div>'; return; }
  const tabs = [['checkin','Check‑in','<path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 3v2h6V3"/>'],
    ['vandaag','Vandaag','<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
    ['plan','Plan','<path d="M4 6h16M4 12h16M4 18h10"/>'],
    ['inzicht','Inzicht','<path d="M3 18l5-6 4 3 4-7 5 4"/>'],
    ['log','Log','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>']];
  const screens = {checkin: vCheckin, vandaag: vVandaag, plan: vPlan, inzicht: vInzicht, log: vLog, meer: vMeer};
  document.getElementById('app').innerHTML = vTimeline() + `<div class="screen" id="screen">${(screens[TAB]||vVandaag)()}</div>` +
    `<div class="tabs">${tabs.map(t=>`<div class="${TAB===t[0]?'on':''}" onclick="goTab('${t[0]}')"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</div>`).join('')}</div>`;
}
function goTab(name){ TAB = name; LS.set('pt_tab', name); render(); }
function vTimeline(){
  const t = D.timeline; const goals = t.goals; const nextIdx = goals.findIndex(g=>!g.done);
  const after = goals.slice(nextIdx+1);
  let stars = `<s class="${'next'}" style="left:78%">★</s>`;
  if(after.length){ stars += `<svg class="brk" style="left:84%" viewBox="0 0 16 16"><path d="M3 0v16M13 0v16" stroke="var(--bg)" stroke-width="4"/><path d="M4 0l5 4-5 4 5 4-5 4M8 0l5 4-5 4 5 4-5 4" fill="none" stroke="var(--ink3)" stroke-width="1.4"/></svg>`; after.forEach((g,i)=>{ stars += `<s style="left:${after.length===1?96:91+i*7}%">★</s>`; }); }
  const doneStars = goals.slice(0,nextIdx).map((g,i)=>`<s class="done" style="left:${2+i*4}%">★</s>`).join('');
  const ticks = (t.ticks||[]).map(x=>`<b style="left:${x}%"></b>`).join('');
  const ng = t.next_goal;
  return `<div class="timeline"><div class="tl">${ticks}<i style="width:${t.pct}%"></i><em style="left:${t.pct}%"></em>${doneStars}${stars}</div>

function markerRows(rows){

    if(r.delta!=null && r.delta!==0){ const good = r.lower_better ? r.delta<0 : r.delta>0; cls = good?'up':'dn'; dl=(r.delta>0?'+':'')+nl(r.delta, Number.isInteger(r.delta)?0:1); }
    else if(r.delta===0) dl='0';
    const val = r.value==null ? '—' : (Number.isInteger(r.value)? r.value : nl(r.value, r.unit==='°C'?2:1));

  return `<ul class="trk">${out}</ul>`;
}

// ---------------------------------------------------------------- inzicht
function chart(series, opts){
  // series: [{pts:[{x:Date,y:number}], cls, dash, dots, color}], opts: {y0,y1, yfmt, band:[lo,hi]}
  const W=340, H=130, pl=34, pr=8, pt=8, pb=20; const xs = series.flatMap(s=>s.pts.map(p=>+p.x)); const x0 = opts.x0 ? +opts.x0 : Math.min(...xs), x1 = opts.x1 ? +opts.x1 : Math.max(...xs);
  const ys = series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null); let y0 = opts.y0 ?? Math.min(...ys), y1 = opts.y1 ?? Math.max(...ys); if(y1===y0){ y1=y0+1; }
  const X = x => pl + (x1===x0?0:(+x-x0)/(x1-x0))*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [y0, (y0+y1)/2, y1].forEach(v=>{ g += `<text x="2" y="${Y(v)+3}" font-size="9" fill="var(--ink3)">${opts.yfmt?opts.yfmt(v):nl(v,0)}</text><line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/>`; });
  if(opts.band){ const [lo,hi]=opts.band; g += `<rect x="${pl}" y="${Y(hi)}" width="${W-pl-pr}" height="${Math.max(0,Y(lo)-Y(hi))}" fill="var(--e-bg)" opacity=".8"/>`; }
  series.forEach(s=>{ const pts = s.pts.filter(p=>p.y!=null && +p.x>=x0 && +p.x<=x1); if(!pts.length) return;
    if(s.dots){ g += pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${s.r||2.6}" fill="${s.color}"/>`).join(''); }
    else g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`; });
  const lab = d => new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
  g += `<text x="${pl}" y="${H-6}" font-size="9" fill="var(--ink3)">${lab(x0)}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="var(--ink3)" text-anchor="end">${lab(x1)}</text></svg>`;
  return g;
}

function vLog(){
  const days = D.log.map(L=>{
    const planned = L.planned.map(p=>`<li><div class="li-main"><b>${esc(p.code)} · ${esc(p.name)}</b><span>gepland · ${p.minutes} min</span></div><div class="li-r">${p.kind==='vervalt'?'<span class="pill r">vervalt</span>':p.kind==='kracht'?'<span class="pill s">kracht</span>':p.quality?'<span class="pill q">kwaliteit</span>':'<span class="pill e">rustig</span>'}</div></li>`).join('');
    const acts = L.activities.map(a=>`<li><div class="li-main"><b>${esc(a.activity_type)}${a.distance_m?` · ${nl(a.distance_m/1000)} km`:''}</b><span>${dur(a.duration_s)}${a.pace?` · ${a.pace}`:''}${a.avg_hr?` · HR ${a.avg_hr}`:''}${a.max_hr?` · max ${a.max_hr}`:''} ${a.hr_source?`<span class="pill r">${a.hr_source==='strap'?'band':'pols'}</span>`:''}${a.self_effort?` · zwaarte ${a.self_effort}/10`:''}</span></div><div class="li-r">${L.trimp?`TRIMP ${L.trimp}`:''}</div></li>`).join('');
    const ch = L.challenge ? `<span class="${L.steps>=10000?'y':'n'}">${(L.steps||0).toLocaleString('nl-NL')} stappen</span><span class="${(L.floors||0)>=10?'y':'n'}">${Math.round(L.floors||0)} trappen</span><span class="${(L.water_ml||0)>=2000?'y':'n'}">${L.water_ml?nl(L.water_ml/1000)+' l':'water –'}</span>` : '';
    const w = L.wellness ? `<span>welzijn ${L.wellness.soreness||'–'}/${L.wellness.fatigue||'–'}/${L.wellness.stress||'–'}${L.wellness.alcohol?' · alcohol':''}${L.wellness.evening_snack?' · snack':''}</span>` : '';
    const dec = L.decision ? `<span class="pill ${L.decision==='GREEN'?'ok':L.decision==='AMBER'?'warn':'r'}">${L.decision}</span>` : '';
    return `<div class="dayhdr"><b>${esc(L.date_txt)}</b><span>${L.week?`week ${L.week}`:''} ${dec}</span></div><div class="card">
      ${(planned||acts)?`<ul class="list">${planned}${acts}</ul>`:`<div class="muted">${L.blocked?`Rustperiode (${esc(L.blocked[0])})`:'Geen sessie gepland'}${L.activities.length?'':' · geen activiteit'}</div>`}
      <div class="chk">${ch}${w}</div>
      ${L.coach?`<div class="advice"><b>Coach</b>${esc(L.coach.analysis)}</div>`:(!L.planned.length&&L.rest_advice?`<div class="advice"><b>Advies rustdag</b>${esc(L.rest_advice)}</div>`:'')}
      ${L.personal?`<div class="advice"><b>Personal input</b>${esc(L.personal)}</div>`:''}</div>`; }).join('');
  return `<div class="hdr"><h1>Log</h1><span class="d">per dag · workouts en challenge</span></div>${days}`;
}

// ---------------------------------------------------------------- meer
function vMeer(){
  const z = D.zones; const t = D._updated ? new Date(D._updated).toLocaleString('nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'}) : '–';
  return `<div class="hdr"><h1>Meer</h1><span class="d" onclick="goTab('vandaag')" style="cursor:pointer">← terug</span></div>
  <div class="card"><div class="setrow"><div><b>Synccode</b><span>${esc(CODE.slice(0,7))}••••-••••</span></div><span class="muted" onclick="LS.set('pt_code','');CODE='';renderSetup()" style="cursor:pointer">wijzigen</span></div>
  <div class="setrow"><div><b>Laatste snapshot</b><span>${esc(t)} · gegenereerd ${esc(D.generated_at||'')}</span></div><span class="muted" onclick="load()" style="cursor:pointer">vernieuwen</span></div>
  <div class="setrow"><div><b>Thema</b><span>systeem · licht · donker</span></div><span class="muted"><span onclick="setTheme(null)" style="cursor:pointer">S</span> · <span onclick="setTheme('light')" style="cursor:pointer">L</span> · <span onclick="setTheme('dark')" style="cursor:pointer">D</span></span></div></div>
  <div class="card"><h2>Zones · maximum ${z.hrmax}</h2><ul class="list"><li><div class="li-main"><b>Rustig</b><span>${z.easy[0]}–${z.easy[1]} · plafond 155 · 7:00–7:45</span></div></li><li><div class="li-main"><b>Drempel</b><span>${z.threshold[0]}–${z.threshold[1]} · 5:50–6:05</span></div></li><li><div class="li-main"><b>Noorse 4×4</b><span>${z['4x4'][0]}–${z['4x4'][1]} · herstel ~135</span></div></li><li><div class="li-main"><b>Wedstrijdtempo</b><span>${z.race[0]}–${z.race[1]} · 5:45–6:00</span></div></li></ul></div>
  <div class="card"><h2>Gymregels</h2><ul style="margin:0;padding-left:16px;font-size:13px;line-height:1.5">${D.gym_rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Bronnen</h2><div class="muted">Oura: nacht-HRV, laagste HR, slaap, temperatuur, ademfrequentie. Garmin: borstband-hartslag, tempo, workouts, stappen, trappen, water, weegschaal, zelfevaluatie. Protocol: Nuuttila 2022 / Vesterinen 2016. Data staan alleen achter uw synccode.</div></div>`;
}
function setTheme(t){ if(t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); LS.set('pt_theme', t); }
const th = LS.get('pt_theme', null); if(th) setTheme(th);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
load();
</script>
</body>
