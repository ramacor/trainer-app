// ---------------------------------------------------------------- data
async function api(method, path, body){ const r = await fetch(SYNC_URL+path, {method, headers:{'x-sync-code':CODE,'content-type':'application/json'}, body: body?JSON.stringify(body):undefined}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function load(){
  if(!CODE){ renderSetup(); return; }

  try{ const r = await api('GET','/state'); if(r && r.payload){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); render(); } else if(!D){ renderSetup('Nog geen snapshot voor deze synccode. Draai de dagelijkse ronde op de Mac.'); } }
  catch(e){ if(!D) renderSetup('Kan de server niet bereiken: '+e.message); else toast('Offline: laatste snapshot getoond'); }
}
function renderSetup(msg){ document.getElementById('app').innerHTML = `<div class="setup"><h1 style="font-size:28px;margin:0 0 6px">Trainer</h1><p class="muted">Vul de synccode in die op de Mac in config/app_sync.json staat. De code is het enige geheim; uw gegevens staan achter die code.</p>${msg?`<p class="muted" style="color:var(--red)">${esc(msg)}</p>`:''}<input id="code" placeholder="PT-XXXX-XXXX-XXXX" value="${esc(CODE)}"><button class="btn" onclick="saveCode()">Verbinden</button></div>`; }
function saveCode(){ CODE = document.getElementById('code').value.trim().toUpperCase(); LS.set('pt_code', CODE); load(); }

let REFRESHING = false; let COACHING = false;
async function requestCoach(){
  if(COACHING) return; COACHING = true; const before = D && D._updated; render();
  try{ if(CI_TIMER){ clearTimeout(CI_TIMER); CI_TIMER=null; await ciSave(); } await api('PUT','/input',{day:new Date().toISOString().slice(0,10), kind:'coach', data:{at:new Date().toISOString()}}); toast('Coach analyseert gisteren…'); }
  catch(e){ toast('Verzoek mislukt: '+e.message); COACHING=false; render(); return; }
  const t0 = Date.now();
  while(Date.now()-t0 < 180000){
    await new Promise(r=>setTimeout(r,5000));
    try{ const r = await api('GET','/state'); if(r && r.payload && r.updated_at !== before){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); COACHING=false; render(); toast('Coachrapport klaar'); return; } }catch(e){}
  }
  COACHING=false; render(); toast('Geen antwoord van de server; probeer het later opnieuw');
}
async function requestRefresh(){
  if(REFRESHING) return; REFRESHING = true; const before = D && D._updated; render(); document.querySelectorAll('.gear[title=Verversen]').forEach(e=>e.classList.add('spin'));
  toast('Server haalt Oura en Garmin op…');
  try{ await api('PUT','/input',{day:new Date().toISOString().slice(0,10), kind:'refresh', data:{at:new Date().toISOString()}}); }
  catch(e){ toast('Verzoek mislukt: '+e.message); REFRESHING=false; render(); return; }
  const t0 = Date.now();
  while(Date.now()-t0 < 120000){
    await new Promise(r=>setTimeout(r,5000));
    try{ const r = await api('GET','/state'); if(r && r.payload && r.updated_at !== before){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); REFRESHING=false; render(); toast('Bijgewerkt'); return; } }catch(e){}
  }
  REFRESHING=false; render(); toast('Geen nieuwe gegevens binnen 2 minuten; staat de server aan?');
}

// ---------------------------------------------------------------- markers
function markerRows(rows){
  let out='', grp='';
  rows.forEach(r=>{ if(r.group!==grp){ grp=r.group; out+=`<div class="grp">${esc(grp)}</div>`; }
    let dl='–', cls='';
    if(r.delta!=null && r.delta!==0){ const good = r.lower_better ? r.delta<0 : r.delta>0; cls = good?'up':'dn'; dl=(r.delta>0?'+':'')+nl(r.delta, Number.isInteger(r.delta)?0:1); }
    else if(r.delta===0) dl='0';
    const val = r.value==null ? '—' : (Number.isInteger(r.value)? r.value : nl(r.value, r.unit==='°C'?2:1));
    out+=`<li class="${r.status}">${SRC[r.src]||''}<div class="n">${esc(r.name)}${r.sub?`<span>${esc(r.sub)}</span>`:''}</div><div class="v"><span class="num">${val}</span><small>${r.unit?esc(r.unit):''}</small></div><div class="dl ${cls}">${dl}</div></li>`; });
  return `<ul class="trk">${out}</ul>`;
}

  return `<div class="card"><h2>Missie naar de Singelloop · ${p.pursuit.start.slice(8,10)}-${p.pursuit.start.slice(5,7)}-${p.pursuit.start.slice(0,4)} – ${p.pursuit.end.slice(8,10)}-${p.pursuit.end.slice(5,7)}-${p.pursuit.end.slice(0,4)}</h2><div class="goal3">${gl}</div></div>

// ---------------------------------------------------------------- inzicht
function chart(series, opts){
  // series: [{pts:[{x:Date,y:number}], cls, dash, dots, color}], opts: {y0,y1, yfmt, band:[lo,hi]}
  const W=340, H=130, pl=34, pr=8, pt=8, pb=20; const xs = series.flatMap(s=>s.pts.map(p=>+p.x)); const x0 = opts.x0 ? +opts.x0 : Math.min(...xs), x1 = opts.x1 ? +opts.x1 : Math.max(...xs);
  const ys = series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null); let y0 = opts.y0 ?? Math.min(...ys), y1 = opts.y1 ?? Math.max(...ys); if(y1===y0){ y1=y0+1; }
  const X = x => pl + (x1===x0?0:(+x-x0)/(x1-x0))*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [y0, (y0+y1)/2, y1].forEach(v=>{ g += `<text x="2" y="${Y(v)+3}" font-size="9" fill="var(--ink3)">${opts.yfmt?opts.yfmt(v):nl(v,0)}</text><line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/>`; });
  if(opts.band){ const [lo,hi]=opts.band; g += `<rect x="${pl}" y="${Y(hi)}" width="${W-pl-pr}" height="${Math.max(0,Y(lo)-Y(hi))}" fill="var(--e-bg)" opacity=".8"/>`; }
  series.forEach(s=>{ const pts = s.pts.filter(p=>p.y!=null && +p.x>=x0 && +p.x<=x1); if(!pts.length) return;
    if(s.dots){ g += pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${s.r||2.6}" fill="${s.color}"/>`).join(''); }
    else g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`; });
  const lab = d => new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
  g += `<text x="${pl}" y="${H-6}" font-size="9" fill="var(--ink3)">${lab(x0)}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="var(--ink3)" text-anchor="end">${lab(x1)}</text></svg>`;
  return g;
}
const leg = items => `<div class="legend">${items.map(i=>`<span><i style="background:${i[0]}"></i>${i[1]}</span>`).join('')}</div>`;
function vInzicht(){
  const I = D.insight; const d = s => new Date(s);
  const r10 = I.run10k; const c1 = chart([{pts:r10.target.map(p=>({x:d(p.day),y:p.t})), color:'var(--accent)'},{pts:r10.realistic.map(p=>({x:d(p.day),y:p.t})), color:'var(--green)', dash:true},{pts:r10.actual.map(p=>({x:d(p.day),y:p.t10k})), color:'var(--ink)', dots:true, r:3}], {y0:44*60, y1:62*60, yfmt:v=>mmss(v), x0:new Date('2026-09-01'), x1:new Date('2027-10-03')});
  const mt = I.muscle_target, sc = I.scale; const c2 = chart([{pts:mt.map(p=>({x:d(p.day),y:p.v})), color:'var(--accent)'},{pts:sc.map(p=>({x:d(p.day),y:p.muscle_mass_kg})), color:'var(--ink)', dots:true}], {y0:35, y1:39.5, yfmt:v=>nl(v,1), x0:new Date('2026-09-01'), x1:new Date('2027-10-03')});
  const c3 = chart([{pts:I.weight_target.map(p=>({x:d(p.day),y:p.v})), color:'var(--accent)'},{pts:sc.map(p=>({x:d(p.day),y:p.weight_kg})), color:'var(--ink)', dots:true}], {y0:86, y1:97, yfmt:v=>nl(v,0), x0:new Date('2026-09-01'), x1:new Date('2027-10-03')});
  const c3b = chart([{pts:I.fat_target.map(p=>({x:d(p.day),y:p.v})), color:'var(--red)', dash:true},{pts:sc.map(p=>({x:d(p.day),y:p.body_fat_pct})), color:'var(--ink)', dots:true}], {y0:18, y1:30, yfmt:v=>nl(v,0)+' %', x0:new Date('2026-09-01'), x1:new Date('2027-10-03')});
  const M = I.metrics; const bandLo = M.length?M[M.length-1].hrv_band_lo_ms:null, bandHi = M.length?M[M.length-1].hrv_band_hi_ms:null;
  const c4 = M.length ? chart([{pts:M.map(p=>({x:d(p.day),y:p.hrv_ms})), color:'var(--ink3)', dots:true, r:2},{pts:M.map(p=>({x:d(p.day),y:p.hrv_7d_ms})), color:'var(--accent)'}], {band: bandLo?[bandLo,bandHi]:null, yfmt:v=>nl(v,0)}) : '<p class="muted">Nog geen data.</p>';
  const c5 = M.length ? chart([{pts:M.map(p=>({x:d(p.day),y:p.rhr})), color:'var(--ink3)', dots:true, r:2},{pts:M.map(p=>({x:d(p.day),y:p.rhr_7d})), color:'var(--red)'}], {yfmt:v=>nl(v,0)}) : '';
  const c6 = M.length ? chart([{pts:M.map(p=>({x:d(p.day),y:p.sleep_h})), color:'var(--accent)', dots:true, r:2.4}], {y0:4, y1:10, yfmt:v=>nl(v,0)+' u'}) : '';
  const g30 = I.goals30; const n = g30.length; const ns = g30.filter(x=>x.steps>=10000).length, nf = g30.filter(x=>x.floors>=10).length, nw = g30.filter(x=>(x.water_ml||0)>=2000).length;
  const H = I.habits || {}; const hab = (key, name) => { const h = H[key]; if(!h) return ''; const dots = h.days.map(x=>`<i class="${x.v==null?'na':x.v?'n':'y'}" title="${x.eve}"></i>`).join('');
    const txt = h.n_known ? `${h.streak} ${h.streak===1?'avond':'avonden'} zonder ${name}${h.last_yes_txt?` · laatste keer ${esc(h.last_yes_txt)}`:h.since_txt?` · sinds ${esc(h.since_txt)}`:''}` : `nog niets ingevuld`;
    return `<div class="hab"><div class="hab-t"><b>${h.n_known?h.streak:'–'}</b><span>${txt}</span></div><div class="dots">${dots}</div></div>`; };
  const habits = `<div class="card"><h2>Gewoontes · avonden</h2>${hab('evening_snack','avondsnack')}${hab('alcohol','alcohol')}<div class="small" style="margin-top:8px">Laatste 30 avonden uit het wellness report: groen = niet, rood = wel, grijs = niet ingevuld. Teller loopt sinds de laatste gemelde keer.</div></div>`;
  return `<div class="hdr"><h1>Inzicht</h1><span class="d">doelen en trends</span></div>
  <div class="card"><h2>10 km · prognose t.o.v. 50:00</h2>${c1}${leg([['var(--accent)','lijn 1 · schema naar 50:00 (31 jan) en 45:00 (3 okt)'],['var(--green)','lijn 2 · realistisch'],['var(--ink)','lijn 3 · indicatie uit lopen ≥ 4,8 km (Riegel)']])}</div>
  <div class="card"><h2>Kracht · e1RM</h2><p class="muted">${esc(I.strength_kpi.note)}</p></div>
  <div class="card"><h2>Spiermassa (kg, weegschaal)</h2>${c2}${leg([['var(--accent)','doel · 36,7 → 37,7 (feb) → 38,0 (jun) → 38,2'],['var(--ink)','werkelijk']])}</div>
  <div class="card"><h2>Gewicht (kg)</h2>${c3}${leg([['var(--accent)','doel · 94,7 → 91,8 (feb) → 89,4 (jun) → 88'],['var(--ink)','werkelijk']])}</div>
  <div class="card"><h2>Lichaamsvet (%)</h2>${c3b}${leg([['var(--red)','doel · 27,6 → 25 → 22 → 20'],['var(--ink)','werkelijk']])}</div>
  <div class="card"><h2>HRV · nachten en 7-daags gemiddelde</h2>${c4}${leg([['var(--ink3)','nacht'],['var(--accent)','7 d'],['var(--e-bg)','band']])}</div>
  <div class="card"><h2>Laagste nachtelijke hartslag</h2>${c5}</div>
  <div class="card"><h2>Slaap · uren per nacht</h2>${c6}</div>
  ${habits}
  <div class="card"><h2>Challenge · ${n} dagen</h2><ul class="trk"><li class="${ns>=n*0.7?'ok':'warn'}">${ICON_GARMIN}<div class="n">Stappen ≥ 10.000</div><div class="v">${ns} / ${n}</div><div class="dl">${n?Math.round(ns/n*100):0} %</div></li><li class="${nf>=n*0.7?'ok':'warn'}">${ICON_GARMIN}<div class="n">Trappen ≥ 10</div><div class="v">${nf} / ${n}</div><div class="dl">${n?Math.round(nf/n*100):0} %</div></li><li class="${nw>=n*0.7?'ok':'na'}">${ICON_GARMIN}<div class="n">Water ≥ 2 l</div><div class="v">${nw} / ${n}</div><div class="dl">${nw?Math.round(nw/n*100)+' %':'–'}</div></li></ul></div>`;
}

function vLog(){
  const days = D.log.map(L=>{
    const planned = L.planned.map(p=>`<li><div class="li-main"><b>${esc(wtitle(p))}</b><span>gepland · ${p.minutes} min</span></div><div class="li-r">${p.kind==='vervalt'?'<span class="pill r">vervalt</span>':p.kind==='kracht'?'<span class="pill s">kracht</span>':p.quality?'<span class="pill q">kwaliteit</span>':'<span class="pill e">rustig</span>'}</div></li>`).join('');
    const acts = L.activities.map(a=>`<li><div class="li-main"><b>${esc(a.activity_type)}${a.distance_m?` · ${nl(a.distance_m/1000)} km`:''}</b><span>${dur(a.duration_s)}${a.pace?` · ${a.pace}`:''}${a.avg_hr?` · HR ${a.avg_hr}`:''}${a.max_hr?` · max ${a.max_hr}`:''} ${a.hr_source?`<span class="pill r">${a.hr_source==='strap'?'band':'pols'}</span>`:''}${a.self_effort?` · zwaarte ${a.self_effort}/10`:''}</span></div><div class="li-r">${L.trimp?`TRIMP ${L.trimp}`:''}</div></li>`).join('');
    const CK = L.checked||{}; const cnt = L.challenge||{};
    const lrow = (name, val, ok) => `<li class="${ok?'ok':'warn'}"><div class="n">${name}</div><div class="v"><span class="num">${val}</span></div><div class="dl">${ok?'<span class="tick on">✓</span>':'<span class="tick"></span>'}</div></li>`;
    const stepsOk = (L.steps||0) >= 10000 || !!L.alt || !!CK.beweging, flOk = (L.floors||0) >= 10 || !!CK.trappen, waOk = (L.water_ml||0) >= 2000 || !!CK.water;
    const ch = L.challenge ? `<ul class="trk chal sm">${['push-ups','sit-ups','tibialis raises','calf raises'].filter(k=>k in cnt).map(k=>{ const ok = L.challenge_done || !!CK[k]; return lrow(esc(k[0].toUpperCase()+k.slice(1)), `${ok?cnt[k]:0} / ${cnt[k]}`, ok); }).join('')}
      ${lrow('Beweging', L.alt?`${L.alt} ✓`:`${(L.steps||0).toLocaleString('nl-NL')} / 10k`, stepsOk)}${lrow('Trappen', `${Math.round(L.floors||0)} / 10`, flOk)}${lrow('Water', `${L.water_ml?nl(L.water_ml/1000):'–'} / 2 l`, waOk)}</ul>` : '';
    const w = L.wellness ? `<span>welzijn ${L.wellness.soreness||'–'}/${L.wellness.fatigue||'–'}/${L.wellness.stress||'–'}${L.wellness.alcohol?' · alcohol':''}${L.wellness.evening_snack?' · snack':''}</span>` : '';
    const dec = L.decision ? `<span class="pill ${L.decision==='GREEN'?'ok':L.decision==='AMBER'?'warn':'r'}">${L.decision}</span>` : '';
    return `<div class="dayhdr"><b>${esc(L.date_txt)}</b><span>${L.week?`week ${L.week}`:''} ${dec}</span></div><div class="card">
      ${(planned||acts)?`<ul class="list">${planned}${acts}</ul>`:`<div class="muted">${L.blocked?`Rustperiode (${esc(L.blocked[0])})`:'Geen sessie gepland'}${L.activities.length?'':' · geen activiteit'}</div>`}
      ${ch}${w?`<div class="chk">${w}</div>`:''}
      ${L.coach?`<div class="advice"><b>Coach</b>${esc(L.coach.analysis)}</div>`:(!L.planned.length&&L.rest_advice?`<div class="advice"><b>Advies rustdag</b>${esc(L.rest_advice)}</div>`:'')}
      ${L.personal?`<div class="advice"><b>Personal input</b>${esc(L.personal)}</div>`:''}</div>`; }).join('');
  return `<div class="hdr"><h1>Log</h1><span class="d" onclick="goTab('menu')" style="cursor:pointer">← menu</span></div>${days}`;
}

}
