<script>

// Geen knijp- of dubbeltikzoom: iOS Safari negeert user-scalable=no, dus de gebaren zelf blokkeren.

const SYNC_URL = 'https://duhynxczceeqixyocaqr.supabase.co/functions/v1/pt';
const LS = { get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set:(k,v)=>{ try{localStorage.setItem(k, JSON.stringify(v));}catch(e){} } };
let CODE = LS.get('pt_code', ''); let D = LS.get('pt_snapshot', null); let TAB = LS.get('pt_tab', 'vandaag');
const ICON_OURA = '<i class="src oura"><svg viewBox="0 0 40 40" width="16" height="16"><rect x="13" y="3" width="14" height="4" rx="1" fill="currentColor"/><circle cx="20" cy="24" r="12.5" fill="none" stroke="currentColor" stroke-width="4"/></svg></i>';
const ICON_GARMIN = '<i class="src garmin"></i>';
const ICON_SELF = '<i class="src self"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></i>';
const SRC = { oura: ICON_OURA, garmin: ICON_GARMIN, self: ICON_SELF };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = (x, nd=1) => x==null ? '–' : Number(x).toLocaleString('nl-NL', {minimumFractionDigits:nd, maximumFractionDigits:nd});
const dur = s => { s=Math.round(s||0); const m=Math.floor(s/60), r=s%60; return s>=3600 ? `${Math.floor(s/3600)}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(r).padStart(2,'0')}` : `${m}:${String(r).padStart(2,'0')}`; };
const mmss = s => { s=Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 2200); }

// ---------------------------------------------------------------- data
async function api(method, path, body){ const r = await fetch(SYNC_URL+path, {method, headers:{'x-sync-code':CODE,'content-type':'application/json'}, body: body?JSON.stringify(body):undefined}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function load(){
  if(!CODE){ renderSetup(); return; }
  render();
  try{ const r = await api('GET','/state'); if(r && r.payload){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); render(); } else if(!D){ renderSetup('Nog geen snapshot voor deze synccode. Draai de dagelijkse ronde op de Mac.'); } }
  catch(e){ if(!D) renderSetup('Kan de server niet bereiken: '+e.message); else toast('Offline: laatste snapshot getoond'); }
}
function renderSetup(msg){ document.getElementById('app').innerHTML = `<div class="setup"><h1 style="font-size:28px;margin:0 0 6px">Trainer</h1><p class="muted">Vul de synccode in die op de Mac in config/app_sync.json staat. De code is het enige geheim; uw gegevens staan achter die code.</p>${msg?`<p class="muted" style="color:var(--red)">${esc(msg)}</p>`:''}<input id="code" placeholder="PT-XXXX-XXXX-XXXX" value="${esc(CODE)}"><button class="btn" onclick="saveCode()">Verbinden</button></div>`; }
function saveCode(){ CODE = document.getElementById('code').value.trim().toUpperCase(); LS.set('pt_code', CODE); load(); }

// ---------------------------------------------------------------- shell
function render(){
  if(!D){ document.getElementById('app').innerHTML = '<div class="setup"><p class="muted">Laden…</p></div>'; return; }
  const tabs = [['checkin','Reflect','<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>'],
    ['vandaag','Vandaag','<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
    ['doel','Doel','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'],
    ['plan','Plan','<path d="M4 6h16M4 12h16M4 18h10"/>'],
    ['inzicht','Inzicht','<path d="M3 18l5-6 4 3 4-7 5 4"/>'],
    ['menu','Menu','<path d="M4 7h16M4 12h16M4 17h16"/>']];
  const screens = {checkin: vCheckin, vandaag: vVandaag, doel: vDoel, plan: vPlan, inzicht: vInzicht, menu: vMenu, log: vLog, meer: vMeer, reminders: vReminders};
  const tabOf = {log:'menu', meer:'menu', reminders:'menu'}; const cur = tabOf[TAB] || TAB;
  const old = document.getElementById('screen'); const keep = (old && LAST_TAB===TAB) ? old.scrollTop : 0;
  const oldChips = document.querySelector('.chips'); const keepX = (oldChips && LAST_TAB===TAB) ? oldChips.scrollLeft : 0;
  document.getElementById('app').innerHTML = vTimeline() + `<div class="screen" id="screen">${(screens[TAB]||vVandaag)()}</div>` +
    `<div class="tabs">${tabs.map(t=>`<div class="${cur===t[0]?'on':''}" onclick="goTab('${t[0]}')"><svg viewBox="0 0 24 24">${t[2]}</svg>${t[1]}</div>`).join('')}</div>`;
  if(keep){ const sc=document.getElementById('screen'); if(sc) sc.scrollTop = keep; }
  if(keepX){ const ch=document.querySelector('.chips'); if(ch) ch.scrollLeft = keepX; }
  LAST_TAB = TAB;
}
let LAST_TAB = null;
let REFRESHING = false; let COACHING = false;
function syncAgeMin(x){ return x ? (Date.now() - new Date(x).getTime())/60000 : Infinity; }
function watchToday(){ const w = D.markers && D.markers.sync && D.markers.sync.watch; if(!w) return false; const d = new Date(w); const n = new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }
function requestCoach(){
  const s = (D.markers && D.markers.sync) || {}; const oA = syncAgeMin(s.oura), gA = syncAgeMin(s.garmin); const wt = watchToday();
  const stale = oA > 10 || gA > 10;

  let h = `<h3>Eerst even controleren</h3>`;
  if(!wt) h += `<p style="margin-top:8px"><b>Je horloge is vandaag nog niet gesynchroniseerd</b> (laatste keer ${s.watch?esc(new Date(s.watch).toLocaleString('nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'})):'onbekend'}). Zonder die sync ontbreken de stappen, de slaap van het horloge en eventueel de workout van gisteren in het rapport. Open Garmin Connect op je telefoon zodat het horloge synchroniseert, kom dan terug en genereer opnieuw.</p>`;
  if(stale) h += `<p style="margin-top:8px">De Oura- en Garmin-gegevens op de server zijn ${Math.round(Math.max(oA,gA))} minuten oud; de server ververst ze vóór het rapport automatisch (dat duurt zo'n halve minuut extra).</p>`;
  h += `<div style="margin-top:14px">${!wt?`<button class="btn" onclick="closeModal();toast('Synchroniseer het horloge en genereer daarna opnieuw')">Eerst horloge synchroniseren</button>`:''}<button class="btn ${!wt?'ghost':''}" onclick="closeModal();coachGo()">${!wt?'Toch genereren':'Verversen en genereren'}</button><button class="btn ghost" onclick="closeModal()">Annuleren</button></div>`;
  document.getElementById('mbody').innerHTML = h; document.getElementById('modal').classList.add('open');
}
async function coachGo(){
  if(COACHING) return; COACHING = true; const before = D && D._updated; render();
  try{ if(CI_TIMER){ clearTimeout(CI_TIMER); CI_TIMER=null; await ciSave(); } await api('PUT','/input',{day:new Date().toISOString().slice(0,10), kind:'coach', data:{at:new Date().toISOString()}}); toast('Server ververst Oura en Garmin en maakt het rapport…'); }
  catch(e){ toast('Verzoek mislukt: '+e.message); COACHING=false; render(); return; }
  const t0 = Date.now();
  while(Date.now()-t0 < 240000){
    await new Promise(r=>setTimeout(r,5000));
    try{ const r = await api('GET','/state'); if(r && r.payload && r.updated_at !== before){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); COACHING=false; CI_UNLOCK=false; render(); toast('Coachrapport klaar'); return; } }catch(e){}
  }
  COACHING=false; render(); toast('Geen antwoord van de server; probeer het later opnieuw');
}
async function requestRefresh(){
  if(REFRESHING) return; REFRESHING = true; const before = D && D._updated; render(); document.querySelectorAll('.gear[title=Verversen]').forEach(e=>e.classList.add('spin'));

  while(Date.now()-t0 < 120000){
    await new Promise(r=>setTimeout(r,5000));
    try{ const r = await api('GET','/state'); if(r && r.payload && r.updated_at !== before){ D = r.payload; D._updated = r.updated_at; LS.set('pt_snapshot', D); REFRESHING=false; render(); toast('Bijgewerkt'); return; } }catch(e){}
  }

const CHEV = '<span class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
const CNAME = {A:'Run 1', B:'Run 2', C:'Run 3', S1:'Gym 1', S2:'Gym 2', S3:'Gym 3'};
function cname(c){ return CNAME[c] || c; }
function wname(x){ return (x.name||'').replace(/^(Gym|Run) \d · /,'').replace(/^Rust · /,''); }
function wtitle(x){ return (x.kind==='rust' || /^(Gym|Run) \d/.test(x.name||'')) ? x.name : `${cname(x.code)} · ${x.name}`; }

  const t = D.timeline; const goals = t.goals; const nextIdx = goals.findIndex(g=>!g.done);

}

  return `<div class="focus">${logo}<div><b>Doel ${idx} · ${esc(ng.name)}</b><span>${esc(ng.date_txt)} · nog ${ng.days_left} dagen · ${esc(ng.target)}</span></div><em>★</em></div>`; }

  const c = D.today_block.coach || {}; const fresh = c.report && c.generated_at && String(c.generated_at).slice(0,10) === D.today;

// ---------------------------------------------------------------- markers
const INFO = {
 'biomarkers': ['Bio markers', `Meetwaarden uit drie bronnen: de Oura-ring (de nacht), het Garmin-horloge (workouts, stappen, weegschaal) en uw eigen wellness report. Samen vormen ze het ochtendbesluit: groen, oranje of rood.

## Waarom juist deze waarden
De selectie volgt de wetenschappelijke consensus over het monitoren van herstel (Kellmann 2018; Meeusen 2013): een paar objectieve trendmaten van het autonome zenuwstelsel, één prestatiemaat uit de training zelf, en korte subjectieve vragen, die in 56 studies gevoeliger bleken dan bloedwaarden of hartslag alleen (Saw 2016). Geen samengestelde scores van fabrikanten: die zijn niet te herleiden en niet gevalideerd tegen prestatie.

Tik op een groep of een marker voor de uitleg, de onderzoeken en de grenzen.`],
 'Hersteltrend': ['Hersteltrend', `Drie markers die geen momentopname zijn maar een trend: het 7-daags gemiddelde van de nachtelijke HRV en van de laagste nachthartslag, elk vergeleken met uw eigen band, en de hartslag op een vast rustig looptempo over 14 dagen.

## Waarom een trend en geen nacht
Een enkele nacht HRV schommelt 10 tot 20 procent door toeval (Buchheit 2014). Pas het gemiddelde over zeven dagen is stabiel genoeg om een echte verandering te zien; in de studies die training op HRV sturen is dat ook de maat die werkt (Plews 2013; Vesterinen 2016). De band van plus en min een halve standaarddeviatie rond een baseline van vier weken komt letterlijk uit die protocollen.

## Wat ermee gebeurt
Deze drie bepalen, samen met welzijn, het stoplicht. Lopers die hun harde dagen zo plannen, verbeterden bijna twee keer zoveel als lopers met een vast schema, met minder harde sessies (Vesterinen 2016), en vooral: er waren veel minder niet-responders (meta-analyse Manresa-Rocamora 2021).`],
 'Stopsignalen': ['Stopsignalen', `Directe signalen van gisteren en vannacht die het stoplicht kunnen overrulen: welzijn, pijn of ziekte, temperatuur, slaap, de laagste nachthartslag en de ademfrequentie.

## Waarom apart van de trend
De trendmarkers zijn traag en robuust; stopsignalen zijn snel en gevoelig. Eén afwijking is vaak ruis, maar twee tegelijk of twee dagen op rij is in het onderzoek het patroon dat ziekte of overbelasting voorspelt (Mason 2022; Meeusen 2013). Daarom laten ze een groene ochtend oranje of rood worden, nooit andersom.

## Best practice
Topsporters gebruiken precies deze combinatie: een objectief ochtendsignaal plus een vragenlijst van een minuut. De consensus van sportwetenschappers (Kellmann 2018) noemt dat de kern van elk monitoringsysteem; alles daarbovenop is detail.`],
 'Weegschaal': ['Weegschaal', `Gewicht, vetpercentage en spiermassa van de Garmin-weegschaal, nuchter gewogen op hetzelfde moment van de dag.

## Hoe we ernaar kijken
Eén meting zegt weinig: vocht, eten en het tijdstip laten het gewicht een kilo schommelen en het vetpercentage twee tot drie procent. De schaal schat vet en spier via bio-impedantie (elektrische weerstand), die vooral in de romp onnauwkeurig is. Daarom tellen alleen gemiddelden over weken, en kleurt een rij op de richting ten opzichte van de vorige weging. Zonder weging vandaag blijft hij grijs.

## Doelen
Gewicht naar 88 kg over de missie, met een half tot één procent per week als tempo waarbij spier behouden blijft (Helms 2014). Spiermassa realistisch een kwart tot een halve kilo per maand; dat wordt pas na twee tot drie maanden zichtbaar boven de ruis van de schaal.`],
 'wellness': ['Wellness report', `Uw eigen oordeel over lichaam en hoofd, elke ochtend vóór de workout. In een overzicht van 56 studies reageerden zulke korte vragenlijsten gevoeliger en consistenter op trainingsbelasting dan HRV, hartslag of bloedwaarden (Saw 2016). Ze gaan terug op de Hooper-index (Hooper 1995) en de vragenlijst van McLean (2010), die profteams dagelijks gebruiken.

## De schalen (1 tot 7)
• Spierpijn: 1 = geen, 7 = overal pijnlijk. Boven 5 telt als afwijkend; 5 of hoger vóór een kwaliteitsloop geeft een keuze of een rustige variant.
• Vermoeidheid: 1 = fris, 7 = uitgeput. Boven 5 telt als afwijkend; dit is de meest belastinggevoelige vraag.
• Stress: 1 = ontspannen, 7 = gespannen. Boven 5 telt als afwijkend; stress buiten de sport verhoogt het blessurerisico ongeveer drievoudig (Mann 2016).
• Stemming: 1 = somber of prikkelbaar, 7 = opgewekt. Onder 3 telt als afwijkend; stemming is een vroeg teken van overbelasting (Meeusen 2013).
• Motivatie: 1 = geen zin om te trainen, 7 = veel zin. Weegt mee in fris of vermoeid; 2 of lager is een vroeg signaal.

## De vinkjes
Pijn aan gewricht of pees (iets anders dan spierpijn) en ziektesymptomen zetten een groene ochtend op oranje. Eetlust minder is een licht signaal uit de overtrainingsconsensus. Alcohol verklaart een slechte nacht en haalt die uit de band. Avondsnack is een gewoonte die u wilt volgen, geen herstelmaat.

## Bediening
Paarse omtrek om een cijfer is uw waarde van gisteren. Nog een keer tikken op een cijfer maakt de keuze ongedaan. Na het coachrapport staat het formulier op slot tot u op Toch wijzigen tikt.`],
 'personal': ['Personal input', `Vrije tekst over gisteren: wat er speelde, hoe het voelde, een pijntje, werkdruk, reistijd. De coach gebruikt het om te begrijpen waarom iets wel of niet gelukt is en haalt er de context uit die cijfers niet geven. Uit het onderzoek naar coachgesprekken blijkt dat juist dit de data betekenis geeft: het getal zegt wat, uw verhaal zegt waarom.`],
 'coach': ['Coach', `Het dagrapport: wat gisteren betekende, wat de nacht zegt, hoe u ervoor staat voor de sessie van vandaag, wat u vóór, tijdens en na die sessie eet en drinkt, en wat eraan komt. Het wordt alleen op uw verzoek gemaakt, zodat uw wellness report en de laatste synchronisatie erin zitten.

## Hoe het is opgebouwd
De structuur volgt het onderzoek naar effectieve feedback (Hattie en Timperley 2007; Mageau en Vallerand 2003): verandering ten opzichte van uw eigen eerdere waarden in plaats van absolute cijfers, uitleg van het waarom, maximaal drie punten en één actie, geen lof zonder referent, geen diagnose. Feiten uit de sportwetenschap en uitspraken van atleten komen alleen als ze bij de dag passen.

## Beoordelen
De duimen en opmerkingen sturen de coach bij: lengte, citaten, feiten, herhaling en vragen passen zich aan, en onderdelen die u niet nuttig vond komen niet terug.`],
 'HRV 7 d': ['HRV 7 d', `HRV, hartritmevariabiliteit, is de variatie in de tijd tussen opeenvolgende hartslagen tijdens de nacht, gemeten door de ring. Meer variatie betekent dat het parasympathische zenuwstelsel, de rem van het lichaam, de overhand heeft: het lichaam herstelt. Minder variatie betekent dat het lichaam in de waakstand staat, door training, stress, alcohol of ziekte.

## Waarom het 7-daags gemiddelde en een eigen band
Eén nacht HRV heeft 10 tot 20 procent ruis (Buchheit 2014); een enkele lage nacht zegt dus bijna niets. Het gemiddelde over zeven nachten is wel betrouwbaar (Plews 2013), en het wordt vergeleken met uw eigen band: plus en min een halve standaarddeviatie rond een baseline van vier weken. Dat is exact het protocol uit de studies waarin lopers hun harde sessies op HRV planden en meer vooruitgingen dan met een vast schema (Vesterinen 2016; Nuuttila 2017).

## Wanneer het niet goed is
Onder de band: het lichaam heeft de belasting nog niet verwerkt; een kwaliteitssessie wordt rustig. Boven de band is in het protocol ook een signaal: meestal diep herstel, soms het begin van overbelasting. Twee ochtenden op rij is een patroon, één is ruis. Bij minder dan vijf geldige nachten is de band nog in opbouw en geeft de app geen oordeel.`],
 'Laagste HR 7 d': ['Laagste HR 7 d', `Het 7-daags gemiddelde van de laagste hartslag in de nacht, de zuiverste rusthartslag die er is: geen houding, geen koffie, geen stress van de dag.

## Waarom we het volgen
Een dalende rusthartslag over weken is het klassieke teken van een fitter hart dat per slag meer bloed rondpompt. Een stijging boven de eigen band, ongeveer drie procent, is het omgekeerde: het lichaam werkt harder in rust, door vermoeidheid, alcohol, warmte of beginnende ziekte. Een hogere rusthartslag betekent meer energieverbruik, minder rust en minder herstel. Buchheit (2014) laat zien dat de rusthartslag naast HRV een eigen, aanvullend signaal is; samen vormen ze het beste beeld van de herstelstatus.

## Wanneer het niet goed is
Boven de band twee ochtenden op rij maakt een kwaliteitssessie rustig. Eén afwijkende nacht hoort bij de stopsignalen, niet bij deze trend.`],
 'HR op 7:15 p/km': ['HR op 7:15 p/km', `De hartslag die u nodig heeft voor een vast rustig tempo van 7:15 per kilometer, berekend uit uw lopen met borstband, gemiddeld over 14 dagen en vergeleken met de 14 dagen ervoor.

## Waarom deze maat
Dit is de enige marker die rechtstreeks uit de prestatie komt: dezelfde snelheid voor minder hartslag is per definitie conditie. Vesterinen (2014) toonde dat zo'n hartslag-snelheidsindex uit gewone trainingen de vooruitgang over een blok goed volgt, en Buchheit (2014) dat een stijging van ongeveer vier procent bij gelijk tempo vermoeidheid of beginnende ziekte verraadt.

## Waarom 14 dagen
Eén loop varieert zo'n drie procent door warmte, slaap, cafeïne en de route (Buchheit 2014). Over twee weken middelen die toevalligheden uit, en de vergelijking met de twee weken ervoor laat een echte verschuiving van meer dan vier slagen zien.

## Wanneer het niet goed is
Hoger dan de periode ervoor bij gelijk tempo. Lager is winst. Zonder borstband of zonder lopen op dit tempo blijft de rij grijs.`],
 'Welzijn': ['Welzijn', `De hoogste score uit uw wellness report: spierpijn, vermoeidheid, stress en de omgekeerde stemming, elk 1 tot 7. Het getal is dus uw slechtste onderdeel van vanochtend.

## Waarom het meetelt in het stoplicht
Subjectieve vragen reageren gevoeliger op trainingsbelasting dan HRV, hartslag of bloedwaarden (Saw 2016, 56 studies). Daarom telt welzijn als vierde beslismarker naast de drie trends, en wegen gevoel en horloge samen zwaarder dan elk apart.

## Wanneer het niet goed is
Boven 5 geldt als afwijkend en maakt een kwaliteitssessie rustig. Spierpijn van 5 of hoger vóór een kwaliteitsloop geeft een keuze tussen een drempelvariant en verschuiven, omdat spieren 48 uur nodig hebben waar HRV in één nacht herstelt.`],
 'Pijn of ziekte': ['Pijn of ziekte', `Uw vinkjes voor pijn aan een gewricht of pees, ziektesymptomen en minder eetlust.

## Waarom het een stopsignaal is
Pijn aan pees, knie of scheen is iets anders dan spierpijn: pezen passen zich veel trager aan dan spieren (Magnusson en Kjaer 2019) en loopblessures lopen daardoor achter op de conditie aan. Pijn betekent: geen kwaliteitsloop en geen zware benen, rustig lopen alleen als het pijnvrij is; drie dagen pijn is een reden om ernaar te laten kijken.

Symptomen zonder koorts volgen de nekregel uit de sportgeneeskunde: boven de nek (neus, keel) mag rustig, onder de nek (borst, hoesten, rillerig) niet. Samen met een verhoogde temperatuur of een hartslagpiek activeren ze de ziektepoort. Minder eetlust staat in de overtrainingsconsensus (Meeusen 2013) als vroeg teken.`],
 'Temperatuur': ['Temperatuur', `De afwijking van uw huidtemperatuur in de nacht ten opzichte van uw eigen gemiddelde, gemeten door de ring.

## Waarom we het volgen
Uw nachttemperatuur is zo stabiel dat een halve graad al betekenis heeft. In een studie met ruim 60.000 ringdragers (Mason 2022, TemPredict) was de combinatie van temperatuur, hartslag, HRV en ademfrequentie gemiddeld bijna drie dagen vóór een positieve test te zien, met 82 procent gevoeligheid. Trainen met beginnende koorts verlengt de ziekte en belast het hart; daarom gaat dit signaal vóór alles.

## Wanneer het niet goed is
Plus 0,5 graad of meer, zeker twee nachten op rij of samen met een hogere nachthartslag of ademfrequentie: dan geen harde training, en bij koorts rust tot u 24 uur klachtenvrij bent.`],
 'Slaap': ['Slaap', `De totale slaaptijd van vannacht volgens de ring. De delta is het verschil met uw 14-daags gemiddelde, want bij slaap gaat het om de afstand tot wat u nodig heeft, niet om het verschil met gisteren.

## Waarom het belangrijk is
Slaap is het grootste deel van het herstel: groeihormoon, spierherstel en het verwerken van de trainingsprikkel gebeuren vooral in de nacht. Jonge atleten met minder dan acht uur slaap hadden een 1,7 keer hoger blessurerisico (Milewski 2014); de consensus voor volwassen sporters noemt onder de zeven uur een tekort (Walsh 2021). Andersom werkt slaapverlenging als training: basketballers die vijf weken tien uur in bed lagen, sprintten sneller en schoten beter (Mah 2011). Eliud Kipchoge slaapt naar eigen zeggen acht uur per nacht en nog een tot twee uur overdag.

## Waarom 14 dagen
Slaapschuld bouwt zich over dagen op en wordt over dagen afgelost. Het gemiddelde van twee weken laat zien of u structureel genoeg slaapt; één korte nacht is pas een probleem vóór een kwaliteitssessie.

## Wanneer het niet goed is
Onder de zes uur vóór een kwaliteitssessie maakt die sessie rustiger. Een 14-daags gemiddelde onder de zeven uur is een chronisch tekort. De slaapkwaliteit beoordeelt u beter zelf dan de ring; die telt daarom niet mee.`],
 'Laagste HR': ['Laagste HR vannacht', `De laagste hartslag van deze ene nacht. De 7-daagse versie in Hersteltrend is de trend; dit is het directe signaal.

## Waarom een piek een stopsignaal is
Een plotse stijging van meer dan een paar slagen boven uw eigen normaal betekent dat het lichaam in rust harder werkt dan anders. De oorzaken zijn bijna altijd dezelfde, en ze werken allemaal in dezelfde richting:
• Alcohol: drukt de HRV en tilt de nachthartslag op, dosisafhankelijk, ook bij één of twee glazen (Pietilä 2018, ruim 4.000 mensen).
• Een late of zware maaltijd: de spijsvertering werkt door en houdt de hartslag hoger.
• Warmte of vochttekort: het hart compenseert voor een lager bloedvolume.
• Beginnende ziekte: het immuunsysteem verhoogt de stofwisseling, vaak een dag vóór de eerste klachten (Mason 2022).
• Een zware sessie laat op de dag: de nasleep van de inspanning.

Een hogere rusthartslag betekent meer energieverbruik, minder rust en dus minder herstel in de uren die ervoor bedoeld zijn.

## Wat ermee gebeurt
Eén nacht telt als signaal, niet als trend: de coach noemt de meest waarschijnlijke oorzaak uit uw invoer en kijkt de volgende ochtend opnieuw. Twee nachten op rij of samen met temperatuur of ademfrequentie wordt het rood.`],
 'Ademfrequentie': ['Ademfrequentie', `Het aantal ademhalingen per minuut in de nacht, afgeleid uit het hartsignaal van de ring. Normaal 12 tot 20 en per persoon zeer stabiel.

## Waarom we het volgen
Op zichzelf zegt de ademfrequentie weinig, maar samen met temperatuur en nachthartslag hoort hij bij het ziektecluster dat in de TemPredict-studie (Mason 2022) het begin van een infectie dagen vooruit zag. Twee ademhalingen of meer boven uw eigen gemiddelde is de grens.

## Wat ermee gebeurt
Alleen informatief; de rij geeft geen eigen oordeel. De coach noemt hem als hij samenvalt met andere signalen.`],
 'Gewicht': ['Gewicht', `Nuchter gewicht van de weegschaal, elke ochtend op hetzelfde moment.

## Waarom en hoe
Dagelijkse schommelingen van een kilo zijn vocht en maaginhoud, geen vet. Daarom kleurt de rij op de richting ten opzichte van de vorige weging en telt in Inzicht alleen de trend over weken. Het doel is 88 kg over de missie; een half tot één procent per week is het tempo waarbij spiermassa behouden blijft, mits het eiwit rond 1,6 gram per kilo per dag ligt (Helms 2014; Morton 2018). Sneller afvallen kost spier en herstel, en dat merkt u als eerste in de kwaliteitssessies.`],
 'Lichaamsvet': ['Lichaamsvet', `Het vetpercentage, geschat via bio-impedantie: de weegschaal stuurt een zwakke stroom door het lichaam en leidt uit de weerstand de samenstelling af.

## Hoe betrouwbaar
Voor de ledematen is de methode goed herhaalbaar, voor de romp veel minder; één meting kan twee tot drie procent afwijken door vocht en tijdstip. Nuchter en op hetzelfde moment wegen houdt de ruis klein, en alleen de trend over vier weken zegt iets. Groen bij een daling ten opzichte van de vorige weging.

## Waarom het telt
Minder vet bij gelijke spiermassa verlaagt het gewicht dat elke stap moet dragen: elke kilo scheelt op de 10 km grofweg twee tot drie seconden per kilometer, en de belasting op pezen en gewrichten daalt mee.`],
 'Spiermassa': ['Spiermassa', `De geschatte spiermassa in kilo van dezelfde weegschaal, via bio-impedantie.

## Wat realistisch is
Een getrainde man van begin veertig bouwt met drie gymsessies per week en voldoende eiwit realistisch een kwart tot een halve kilo spier per maand. Dat valt binnen de dag-tot-dagruis van de schaal, dus pas na twee tot drie maanden is het zichtbaar. De betrouwbaardere maat voor spieropbouw is de kracht in de gym: de top-set over vier weken en herhalingsrecords.

## Waarom het telt
Spiermassa is het fundament onder de Gymrace en beschermt tegen het spierverlies dat bij afvallen en bij veel duurtraining dreigt; zware krachttraining verbetert bovendien de loopeconomie met twee tot acht procent (Blagrove 2018). Groen bij een stijging ten opzichte van de vorige weging.`],

const MORE = {
 'HRV 7 d': `## Waarom meer variatie juist goed is
Het hart heeft een eigen gangmaker, de sinusknoop, die uit zichzelf vrij regelmatig klopt, rond de honderd slagen per minuut. Daaroverheen sturen twee takken van het autonome zenuwstelsel: het sympathische deel (het gaspedaal, vechten of vluchten) en het parasympathische deel (de rem, via de nervus vagus: rust, verteren, herstellen). De rem werkt in milliseconden. Bij elke inademing laat hij iets los en versnelt het hart, bij elke uitademing trekt hij aan en vertraagt het. Dat golfje heet de respiratoire sinusaritmie. Een sterk werkende rem geeft dus veel variatie tussen opeenvolgende slagen; het gaspedaal werkt veel trager en vlakt die golf juist uit.

Hoge HRV in rust betekent daarom: de rem is dominant, het lichaam staat in de herstelstand en kan snel schakelen. Lage HRV betekent: het gaspedaal staat open, door training die nog niet verwerkt is, stress, alcohol, ziekte of slaaptekort, en de rem komt er niet tussen. Een uniform kloppend hart in rust is geen teken van gezondheid maar van een lichaam dat paraat staat en niet herstelt. In grote bevolkingsstudies hangt lage HRV samen met hart- en vaatziekten en vroegtijdige sterfte (Framingham, Tsuji 1996).

## Variatie is geen ritmestoornis
HRV beschrijft kleine verschillen van tientallen milliseconden tussen normale slagen, aangestuurd door de ademhaling. Dat is iets anders dan hartritmestoornissen zoals boezemfibrilleren, waar slagen echt chaotisch uitvallen; die worden uit de meting gefilterd.

## Waarom 's nachts en tegen uw eigen baseline
Overdag overheerst het gaspedaal door alles wat u doet; in de diepe slaap is de rem het zuiverst zichtbaar. De absolute hoogte van HRV is grotendeels genetisch en leeftijdsgebonden en verschilt enorm tussen mensen, dus vergelijkt de app alleen met uw eigen gemiddelde. De maat die de ring rapporteert is rMSSD, de wortel uit het gemiddelde kwadraat van de verschillen tussen opeenvolgende slagen; die maat vangt vrijwel alleen de parasympathische activiteit en is daarom de standaard in sportonderzoek (Plews 2013; Buchheit 2014).

## Wat de protocollen precies doen
In de studies van Kiviniemi (2007), Vesterinen (2016) en Nuuttila (2017) kregen lopers hun harde sessie alleen als de HRV binnen de eigen band lag en anders een rustige. De HRV-groep deed minder harde sessies en verbeterde meer. Een meta-analyse van acht studies (Manresa-Rocamora 2021) vond het duidelijkste effect in het aantal niet-responders: 14 procent tegenover 38 procent bij vaste schema's.`,
 'Laagste HR 7 d': `## Wat de rusthartslag vertelt
In rust pompt het hart het bloed rond dat het lichaam nodig heeft; hoeveel slagen dat kost hangt af van het slagvolume, de hoeveelheid bloed per slag. Duurtraining vergroot de linkerkamer en het bloedvolume, zodat het hart per slag meer rondpompt en in rust minder vaak hoeft te kloppen. Daarom hebben getrainde duursporters rustwaarden van 40 tot 50, soms lager, zonder dat er iets mis is. Ook de rem van het autonome zenuwstelsel, dezelfde als bij HRV, drukt de rusthartslag.

## Waarom een stijging belangrijker is dan de hoogte
De absolute waarde verschilt per persoon; de verandering ten opzichte van uw eigen normaal is het signaal. Een stijging van drie tot vijf procent over een paar dagen betekent dat het lichaam in rust harder werkt: het immuunsysteem bij beginnende ziekte, de afbraak van alcohol, de vertering van een late maaltijd, uitdroging bij warmte, of de nasleep van een zware belasting. In de TemPredict-studie (Mason 2022) was de nachthartslag een van de vier signalen die een infectie gemiddeld bijna drie dagen vooruit zagen.

## Waarom de laagste waarde en niet het gemiddelde
Het gemiddelde van de nacht wordt vertroebeld door de eerste uren na het eten en door onrustige fases; de laagste waarde, meestal in de tweede nachthelft, is de meest zuivere rusthartslag en daardoor het best vergelijkbaar van nacht tot nacht.`,
 'HR op 7:15 p/km': `## Het principe
Als u een vast tempo loopt, is de hartslag die u daarvoor nodig heeft een directe maat voor hoe efficiënt het hart-longsysteem werkt. Fitter worden betekent dat het hart per slag meer bloed rondpompt en de spieren meer zuurstof uit dat bloed halen, dus hetzelfde tempo kost minder slagen. Dit is in feite een veldversie van de klassieke submaximale inspanningstest uit het laboratorium.

## Het onderzoek
Vesterinen (2014) toonde dat zo'n hartslag-snelheidsindex, berekend uit gewone trainingen van recreatieve lopers, de vooruitgang over een trainingsblok even goed volgt als een laboratoriumtest (correlaties van 0,43 tot 0,61 met de verbetering van de 3000 m-tijd). Lamberts ontwikkelde een gestandaardiseerde submaximale test (LSCT) met dezelfde logica. Buchheit (2014) laat zien dat de hartslag bij een vaste inspanning van dag tot dag zo'n drie procent varieert en dat een stijging van meer dan vier procent vermoeidheid of een beginnende infectie verraadt.

## Wat de meting vertroebelt
Warmte, vochttekort, cafeïne, slaaptekort, een helling of zachte ondergrond en een polsmeting in plaats van een borstband. Daarom gebruikt de app alleen lopen met borstband, middelt over 14 dagen en vergelijkt met de 14 dagen ervoor. Bij extreme hitte zegt een hogere hartslag niets over de conditie.`,
 'Welzijn': `## Waarom gevoel meetbaar is
Subjectieve vragenlijsten hebben een lange geschiedenis in de sportwetenschap: de POMS-stemmingsvragenlijst in de jaren zeventig, de Hooper-index bij Australische zwemmers (Hooper 1995), waar dagelijkse welzijnsscores driekwart van de variatie in 'staleness' verklaarden, en de korte lijst van McLean (2010) in het profrugby. Het overzicht van Saw, Main en Gastin (2016, 56 studies) is de standaardreferentie: subjectieve maten reageerden gevoeliger en consistenter op acute en chronische belasting dan HRV, hartslag, cortisol of spierenzymen.

## Waarom juist deze vier
Vermoeidheid, stemming en stress bleken in dat overzicht de meest belastinggevoelige schalen; spierpijn is de beste maat voor lokale spierschade. Zelf beoordeelde slaapkwaliteit was de enige schaal die niet meebewoog met de belasting, en die laat de app daarom weg; de slaapduur komt objectief van de ring.

## Hoe het telt
De app neemt de slechtste van de vier als welzijnsscore. Boven 5 op de 7-puntsschaal is de praktijkconventie voor afwijkend; de consensus over monitoring (Thornton 2019, Coutts 2017) adviseert zulke stoplichtregels, met de kanttekening dat de grens individueel is. Omdat subjectieve en objectieve maten elkaar aanvullen en niet sterk correleren, weegt de app ze naast elkaar: bij trainingsbelasting wint het gevoel, bij ziekte de objectieve signalen.`,
 'Pijn of ziekte': `## Pezen en botten passen zich traag aan
Spieren reageren binnen weken op training, pezen en botten hebben maanden nodig (Magnusson en Kjaer 2019). Daarom ontstaan de meeste loopblessures, zoals scheenbeenklachten, achillespees- en knieproblemen, juist in de weken waarin de conditie snel toeneemt en de kilometers oplopen. Pijn aan een pees of gewricht is dus een ander signaal dan spierpijn: spierpijn hoort bij adaptatie, peespijn bij overbelasting van weefsel dat nog niet zover is.

## De nekregel
Uit de sportgeneeskunde: bij klachten boven de nek (loopneus, keelpijn) mag licht getraind worden; bij klachten onder de nek (hoest op de borst, koorts, spierpijn over het hele lichaam, rillingen) niet. Trainen met koorts verlengt de ziekte, en bij virusinfecties kan het de hartspier belasten. De IOC-consensus over belasting en ziekte (Schwellnus 2016) adviseert een geleidelijke terugkeer: eerst een korte, rustige proefsessie na 24 uur klachtenvrij, daarna per koortsdag ongeveer twee rustige dagen.

## Eetlust
Verminderde eetlust staat in de gezamenlijke consensus van de Europese en Amerikaanse sportwetenschappers over overtraining (Meeusen 2013) in de lijst van vroege tekenen, naast slaapproblemen, prikkelbaarheid en motivatieverlies. Op zichzelf licht bewijs, maar in combinatie met andere signalen waardevol.`,
 'Temperatuur': `## Hoe de ring meet
De ring meet de huidtemperatuur aan de vinger de hele nacht en vergelijkt die met uw eigen gemiddelde over de voorgaande weken. De absolute waarde zegt niets (de huid is altijd koeler dan de kern), de afwijking wel, omdat uw nachttemperatuur normaal binnen een paar tienden van een graad stabiel is.

## Waarom koorts vroeg zichtbaar is
Bij een beginnende infectie verhoogt het immuunsysteem het streefpunt van de lichaamstemperatuur, en dat gebeurt eerder dan u zich ziek voelt. In de TemPredict-studie (Mason 2022, ruim 63.000 ringdragers) voegde temperatuur ongeveer vijf procent voorspellende waarde toe aan hartslag, HRV en ademfrequentie; samen zag het algoritme een infectie gemiddeld 2,75 dagen vóór een positieve test, met 82 procent gevoeligheid en 63 procent specificiteit. Die laatste waarde is de reden dat de app temperatuur alleen als cluster gebruikt: alleen temperatuur geeft te veel vals alarm.

## Andere oorzaken van een hogere nachttemperatuur
Een warme slaapkamer, een zware avondmaaltijd, alcohol, een sauna of een late zware training. Daarom telt de app pas vanaf een halve graad, en pas echt bij twee nachten op rij of in combinatie met hartslag en ademfrequentie.`,
 'Slaap': `## Wat er in de slaap gebeurt
In de diepe slaap van de eerste nachthelft komt het meeste groeihormoon vrij, dat spierherstel en weefselopbouw aanstuurt. De REM-slaap later in de nacht verwerkt het geleerde, ook de motorische patronen van een training. Wie kort slaapt, knipt vooral de laatste uren af en verliest daarmee onevenredig veel REM.

## Het bewijs
Milewski (2014) vond bij jonge atleten een 1,7 keer hoger blessurerisico bij minder dan acht uur slaap. De consensus van Walsh (2021) noemt onder de zeven uur voor volwassen sporters een tekort. Mah (2011) liet basketballers vijf weken lang tien uur in bed liggen: snellere sprints, betere schotpercentages en een betere stemming. Eén korte nacht kost nauwelijks kracht maar verhoogt de ervaren inspanning: hetzelfde tempo voelt zwaarder en de hartslag ligt iets hoger.

## Wat topsporters doen
Eliud Kipchoge slaapt naar eigen zeggen acht uur per nacht en nog een tot twee uur overdag. Veel profteams plannen slaap als onderdeel van de training, met vaste bedtijden, een koele donkere kamer en geen schermen in het laatste uur. Een middagdutje van twintig tot dertig minuten is bewezen effectief voor alertheid zonder de nachtslaap te storen.

## Over slaapkwaliteit
De slaapfasen die de ring rapporteert zijn schattingen uit beweging en hartslag en komen maar matig overeen met een slaaplaboratorium. De totale slaaptijd is wel betrouwbaar; daarom gebruikt de app alleen de duur en vergelijkt die met uw 14-daags gemiddelde.`,
 'Laagste HR': `## Waarom de nacht de zuiverste meting is
Overdag bepalen houding, beweging, eten, cafeïne en emoties de hartslag. In de tweede helft van de nacht valt dat allemaal weg en blijft alleen over wat het lichaam zelf nodig heeft. Die laagste waarde is daarom van nacht tot nacht goed vergelijkbaar, veel beter dan een ochtendmeting op de rand van het bed.

## Hoe de verstoorders werken
Alcohol wordt afgebroken tot acetaldehyde, dat het sympathische zenuwstelsel activeert; het hart klopt sneller, de HRV daalt en de lichaamstemperatuur stijgt licht, dosisafhankelijk en uren na het laatste glas (Pietilä 2018). Een late maaltijd houdt de spijsvertering en daarmee de doorbloeding van de darmen actief. Warmte en vochttekort verkleinen het bloedvolume, waardoor het hart vaker moet pompen. Een infectie verhoogt de stofwisseling nog voordat er klachten zijn. Een zware training laat op de dag laat het lichaam in de herstelstand met een verhoogde hartslag achter.

## Wat dat voor het herstel betekent
Elke slag extra per minuut in rust is energie die niet naar herstel gaat. Bij een hogere nachthartslag zijn de diepe slaapfases korter en is de HRV lager: de nacht heeft minder opgeleverd dan de duur suggereert. Daarom is één avond zonder alcohol of late snack vóór een kwaliteitssessie meer waard dan een extra uur in bed.`,
 'Ademfrequentie': `## Hoe de ring het meet
De ademhaling moduleert het hartritme (de respiratoire sinusaritmie uit de uitleg bij HRV) en de bloedvaten in de vinger. Daaruit leidt de ring het aantal ademhalingen per minuut af, zonder sensor op de borst. Bij gezonde volwassenen ligt de nachtwaarde tussen 12 en 20 en is hij per persoon opvallend stabiel, meestal binnen één ademhaling per minuut.

## Waarom het een ziektesignaal is
Bij koorts en luchtweginfecties neemt de zuurstofbehoefte toe en wordt de ademhaling sneller en oppervlakkiger. In de TemPredict-studie (Mason 2022) was de ademfrequentie een van de vier signalen die samen een infectie dagen vooruit zagen. Alleen ademfrequentie is niet specifiek genoeg; samen met temperatuur en hartslag wel.

## Andere oorzaken
Een verstopte neus, alcohol, een hoge slaapkamertemperatuur en slaapapneu verhogen de nachtwaarde ook. Een structureel hoge waarde zonder andere signalen is daarom iets om met een arts te bespreken, geen trainingsbesluit.`,
 'Gewicht': `## Wat het getal schommelt
Het lichaam bevat 55 tot 60 procent water, en dat varieert per dag met zout, koolhydraten en vocht: elke gram opgeslagen glycogeen bindt ongeveer drie gram water, zodat een koolhydraatrijke dag en een zware training het gewicht een kilo heen en weer laten gaan zonder dat er vet bij of af kwam. Nuchter wegen na het toilet, op hetzelfde moment, haalt het grootste deel van die ruis weg.

## Tempo en spierbehoud
Een energietekort van ongeveer 500 kilocalorieën per dag geeft een half kilo vetverlies per week. Sneller dan een procent lichaamsgewicht per week kost merkbaar spiermassa en herstel, zeker in combinatie met duurtraining (Helms 2014). Voldoende eiwit, rond 1,6 gram per kilo per dag, en krachttraining zijn de twee factoren die spier beschermen tijdens afvallen (Morton 2018).

## Waarom het voor het lopen telt
Elke kilo minder is minder massa die bij elke stap moet worden opgevangen en afgezet; vuistregel is twee tot drie seconden per kilometer per kilo bij gelijke conditie, en een lagere belasting op pezen en gewrichten.`,
 'Lichaamsvet': `## Hoe bio-impedantie werkt
De weegschaal stuurt een zwakke wisselstroom door de voeten en meet de weerstand. Spier en bloed bevatten veel water en geleiden goed; vet geleidt slecht. Uit de weerstand, uw lengte, gewicht, leeftijd en geslacht schat een formule de samenstelling. De meting loopt alleen door de benen en de romp; de armen worden geschat.

## Hoe betrouwbaar
De herhaalbaarheid is goed zolang de omstandigheden gelijk zijn, maar de absolute waarde kan enkele procenten afwijken van een DEXA-scan, de gouden standaard. Vocht is de grootste stoorzender: na een training of een avond alcohol is het lichaam droger en leest de schaal een hoger vetpercentage. Daarom alleen nuchter, op hetzelfde moment, en alleen de trend over vier weken.

## Wat realistisch is
Van 27 naar 20 procent bij 95 kilo is ruim zes kilo vet minder. Met een half kilo per week is dat ongeveer drie maanden netto, in de praktijk langer omdat herstelweken en wedstrijden ertussen zitten. De app zet de doellijn daarom over de hele missie.`,
 'Spiermassa': `## Hoe spier groeit
Elke krachtsessie verhoogt de spiereiwitsynthese, het aanmaken van nieuw spiereiwit, gedurende 24 tot 48 uur (Phillips 1997; Damas 2016). Groei ontstaat als die aanmaak over weken groter is dan de afbraak, wat voldoende eiwit (rond 1,6 gram per kilo per dag, verdeeld over de dag) en voldoende volume vraagt: tien tot zestien zware sets per spiergroep per week (Schoenfeld 2017; Pelland 2024). Herhalingen in reserve van één tot twee geven vrijwel dezelfde groei als trainen tot falen, met minder vermoeidheid (Helms 2018).

## Wat realistisch is
Een getrainde man van begin veertig bouwt realistisch een kwart tot een halve kilo spier per maand; de leeftijd remt pas duidelijk vanaf zestig. Dat tempo valt binnen de dagelijkse ruis van een bio-impedantieschaal, dus de schaal bevestigt het pas na twee tot drie maanden. De betrouwbaardere maat is de kracht: de geschatte één-herhalingsmaximum uit de top-set (Epley met herhalingen in reserve) als trend over vier weken, en herhalingsrecords op een vast gewicht.

## Lopen en spier
Kracht en hardlopen in dezelfde week remmen de spiergroei niet, zolang er een paar uur, liever een dag, tussen zit (Schumann 2022, 43 studies). Andersom verbetert kracht de loopeconomie met twee tot acht procent (Blagrove 2018). Alleen een ijsbad direct na de gym dempt de groei (Roberts 2015).`,
 'Hersteltrend': `## De statistiek erachter
Een nachtwaarde van HRV heeft een typische meetfout van ongeveer twaalf procent, de rusthartslag van ongeveer tien procent (Buchheit 2014). De kleinste betekenisvolle verandering is veel kleiner: drie procent voor HRV, twee procent voor hartslag. Een enkele nacht kan dus nooit een verandering van die grootte laten zien; het gemiddelde over zeven nachten wel, mits er minstens drie tot vier geldige nachten in zitten (Plews 2014).

## De band van een halve standaarddeviatie
De protocollen van Vesterinen en Nuuttila berekenen over vier weken het gemiddelde en de spreiding van het 7-daags gemiddelde, en noemen alles buiten een halve standaarddeviatie afwijkend, zowel eronder als erboven. Die band is dus persoonlijk en beweegt mee met uw fitheid; na elke vier weken wordt hij herberekend.

## Waarom drie markers en niet één
HRV meet vooral de rem van het zenuwstelsel, de rusthartslag het hart zelf, en de hartslag op een vast tempo de prestatie. Ze reageren op verschillende verstoorders en bevestigen of weerleggen elkaar; Buchheit beschrijft de combinatie van hartslag en HRV als een tweedimensionaal beeld dat meer zegt dan elk apart.`,
 'Stopsignalen': `## De logica van twee signalen
Elk afzonderlijk signaal, een warme nacht, een hogere hartslag, een slechte stemming, komt vaak genoeg door toeval voor dat handelen op één signaal te veel vals alarm geeft. Twee onafhankelijke signalen tegelijk, of hetzelfde signaal twee dagen op rij, verkleinen die kans sterk. Dat is de kern van het TemPredict-algoritme (Mason 2022) en van de stoplichtsystemen die Robertson (2017) en Thornton (2019) voor topteams beschrijven.

## Welk signaal wint
De app hanteert een vaste volgorde: een ziektecluster (temperatuur plus hartslag of ademhaling) gaat vóór alles; dan pijn en symptomen; dan uw eigen vermoeidheid, spierpijn en stemming, die bij trainingsbelasting gevoeliger zijn dan de ring; dan een nacht die door alcohol of een late maaltijd verklaard is; en pas daarna een losse afwijkende nacht zonder verklaring, die vrijwel altijd ruis is.

## Omkeerbaarheid
Stopsignalen veranderen het plan nooit; ze veranderen alleen de sessie van vandaag, en wel zo dat de prikkel terugkomt zodra het signaal weg is. Dat is bewust: een kwaliteitssessie een dag opschuiven kost niets, een verkoudheid die een week wordt kost veel.`,
 'Weegschaal': `## Waarom de weegschaal apart staat
Gewicht, vet en spier zeggen niets over het herstel van vandaag; ze zeggen iets over de richting over maanden. Daarom tellen ze niet mee in het stoplicht en staan ze in Inzicht als doellijnen.

## Hoe u de ruis klein houdt
Nuchter, na het toilet, vóór het douchen, op hetzelfde moment en met dezelfde hydratatie. Niet wegen na een avond alcohol of een lange duurloop: de schaal leest dan een hoger vetpercentage omdat het lichaam droger is. Het weekgemiddelde is de maat, de dagwaarde niet.`,
 'wellness': `## Waar de vragen vandaan komen
De Hooper-index (1995) vroeg zwemmers dagelijks naar slaap, stress, vermoeidheid en spierpijn op een schaal van 1 tot 7 en verklaarde daarmee driekwart van de variatie in 'staleness'. McLean (2010) voegde stemming toe en gebruikte een 5-puntsschaal in het profrugby. Het overzicht van Saw (2016) bevestigde dat deze korte lijsten gevoeliger zijn dan objectieve maten. De app combineert beide lijsten, laat zelf beoordeelde slaapkwaliteit weg omdat die niet meebeweegt met belasting, en voegt motivatie, pijn, symptomen en eetlust toe uit de overtrainingsconsensus (Meeusen 2013).

## Waarom vóór de workout
Het gevoel van de ochtend beschrijft de nacht en de dag ervoor; na een training is het al gekleurd door de sessie. Daarom het verzoek het vóór de workout in te vullen, en daarom staat het formulier op slot zodra het coachrapport ermee is gemaakt.`,
 'biomarkers': `## Waarom geen fabrikantenscores
Oura's Readiness, Garmins Body Battery en Training Readiness zijn samengestelde scores met niet-gepubliceerde formules. Ze zijn handig als indruk, maar niet herleidbaar en niet gevalideerd tegen prestatie. De app gebruikt daarom de onderliggende metingen (nacht-HRV, laagste hartslag, slaapduur, temperatuur, ademfrequentie) en de regels uit gepubliceerd onderzoek, zodat elke kleur uit te leggen is.

## Hoe de bronnen zich verhouden
De ring is voor de nacht het betrouwbaarst (HRV en hartslag vergelijkbaar met een ECG-band); het horloge voor de training (met borstband) en de dag (stappen, trappen, water, weegschaal). Polsmetingen van de hartslag tijdens intervallen en bij kou zijn onbetrouwbaar; daarom vraagt de app bij kwaliteitssessies om de band.`,
 'coach': `## De principes achter de teksten
Hattie en Timperley (2007) vonden dat feedback het meest werkt als hij drie vragen beantwoordt: waar ga ik heen, hoe doe ik het, wat is de volgende stap. Feedback op de taak en het proces helpt; lof op de persoon helpt niet. Kluger en DeNisi lieten zien dat feedback over verandering ten opzichte van de vorige keer sterker werkt dan absolute scores, en dat weinig feedback meer effect heeft dan veel. Mageau en Vallerand (2003) beschreven autonomie-ondersteunend coachen: uitleg van het waarom, keuzes bieden, geen controlerende taal.

## Wat de coach bewust niet doet
Geen diagnoses, geen angsttaal, geen oordeel over één afwijkende nacht, geen samengestelde scores als argument, geen herhaling van cijfers die u al ziet, hooguit één vraag per rapport en één actie per dag.`,
 'personal': `## Waarom vrije tekst
Cijfers vertellen wat er gebeurde, niet waarom. Een gemiste sessie door tijdgebrek vraagt iets anders dan een gemiste sessie door een pijntje, en dat onderscheid staat in geen enkele meetwaarde. Coaches noemen het gesprek de plek waar de data betekenis krijgt (Buchheit); uw notitie is dat gesprek.`,

function infoHtml(txt){ return txt.split(/\n\n+/).map(b=>{ const lines = b.split('\n'); let h=''; let para=[], list=[];
  const flush=()=>{ if(para.length){ h+=`<p>${esc(para.join(' '))}</p>`; para=[]; } if(list.length){ h+=`<ul>${list.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`; list=[]; } };
  lines.forEach(l=>{ if(l.startsWith('## ')){ flush(); h+=`<h4>${esc(l.slice(3))}</h4>`; } else if(l.startsWith('• ')){ if(para.length){ h+=`<p>${esc(para.join(' '))}</p>`; para=[]; } list.push(l.slice(2)); } else { if(list.length){ h+=`<ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; list=[]; } para.push(l); } });
  flush(); return h; }).join(''); }
const MROWS = {};
function valueNow(key){
  const r = MROWS[key]; if(!r) return '';
  const f = (x, nd) => x==null ? '–' : (Number.isInteger(x) ? String(x) : nl(x, nd==null ? (r.unit==='°C'?2:1) : nd));
  const u = r.unit ? ' '+r.unit : '';
  const stat = {ok:'binnen uw normaal', warn:'let op', bad:'afwijkend', na:'geen waarde'}[r.status] || '';
  const lines = [];
  if(r.value==null && r.txt==null){ lines.push('Vandaag nog geen waarde' + (key==='HR op 7:15 p/km' ? ': er is nog geen loop met borstband op dit tempo in de laatste 14 dagen.' : key.startsWith('Weegschaal')||['Gewicht','Lichaamsvet','Spiermassa'].includes(key) ? ': nog niet gewogen vandaag.' : '.')); }
  else {
    if(r.txt!=null) lines.push(`Nu: ${r.txt}.`);
    else lines.push(`Nu: ${f(r.value)}${u}` + (r.prev!=null ? `, tegenover ${f(r.prev)}${u} ${r.ref||'eerder'}` : '') + (r.delta!=null && r.delta!==0 ? ` (${r.delta>0?'+':''}${f(r.delta)})` : '') + '.');
    if(key==='HRV 7 d'){ if(r.lo!=null && r.hi!=null) lines.push(`Uw band is ${f(r.lo,0)}–${f(r.hi,0)} ms. Het 7-daags gemiddelde ligt ${r.value<r.lo?'onder':r.value>r.hi?'boven':'binnen'} die band; dat bepaalt de kleur van de regel.`); if(r.delta!=null && r.delta!==0) lines.push(`Het cijfer rechts (${r.delta>0?'+':''}${f(r.delta)}) is alleen de richting ten opzichte van de vorige meting: een hogere HRV is op zich gunstig, dus het cijfer kleurt groen, ook als het gemiddelde daardoor net boven uw band uitkomt. De kleur van de regel is het oordeel, het cijfer de beweging.`); if(r.n7!=null && r.n7<5) lines.push(`Met ${r.n7} geldige nachten is de band nog in opbouw.`); }
    else if(key==='Laagste HR 7 d'){ if(r.lo!=null && r.hi!=null) lines.push(`Uw band is ${f(r.lo,0)}–${f(r.hi,0)} bpm. Lager is beter; boven ${f(r.hi,0)} geldt als verhoogd en kleurt de regel.`); if(r.delta!=null && r.delta!==0) lines.push(`Het cijfer rechts is de beweging sinds de vorige meting: dalend is groen, stijgend rood.`); }
    else if(key==='HR op 7:15 p/km'){ lines.push(`Vergeleken met de 14 dagen ervoor: ${r.delta==null?'nog geen vergelijking':(r.delta>=4?'meer dan 4 slagen hoger, dat telt als slechter':r.delta<=-4?'meer dan 4 slagen lager, dat is winst':'binnen de ruis van 4 slagen, dus gelijk')}.`); }
    else if(key==='Welzijn'){ lines.push(`Boven 5 geldt als afwijkend; uw hoogste score is ${f(r.value,0)}, dus ${stat}.`); }
    else if(key==='Temperatuur'){ lines.push(`De grens is +0,5 °C; uw afwijking is ${f(r.value)} °C, dus ${stat}.`); }
    else if(key==='Slaap'){ lines.push(`${r.value<6?'Onder de zes uur: te kort voor een kwaliteitssessie.':r.value<7?'Onder de zeven uur, iets te kort.':'Zeven uur of meer, voldoende.'}`); }
    else if(key==='Laagste HR'){ if(r.avg7!=null) lines.push(`Uw 7-daags gemiddelde is ${f(r.avg7)} bpm; vannacht ${r.value>r.avg7+2.5?'duidelijk daarboven, dat is de piek':'daar niet ver van'}, dus ${stat}.`); }
    else if(key==='Ademfrequentie'){ lines.push(`Twee of meer boven uw gemiddelde telt als signaal; nu ${stat}.`); }
    else if(['Gewicht','Lichaamsvet','Spiermassa'].includes(key)){ lines.push(r.status==='na' ? 'Grijs: vandaag nog niet gewogen; de kleur komt terug bij de volgende weging.' : `Groen of oranje is alleen de richting ten opzichte van de vorige weging${key==='Spiermassa'?' (stijgen is goed)':' (dalen is goed)'}; één weging zegt weinig.`); }
    else if(key==='Pijn of ziekte'){ lines.push(r.status==='bad' ? 'Rood: pijn of symptomen gemeld; geen kwaliteitsloop en geen zware benen vandaag.' : r.status==='warn' ? 'Oranje: minder eetlust gemeld, een licht signaal.' : 'Groen: niets gemeld.'); }
  }
  return `<div class="valbox ${r.status}"><h4>Uw waarde nu · ${esc(stat)}</h4>${lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`;
}
function showInfo(key){ const i = INFO[key]; if(!i) return; const more = MORE[key] ? `<details class="more"><summary>Meer informatie</summary><div class="morebody">${infoHtml(MORE[key])}</div></details>` : ''; document.getElementById('mbody').innerHTML = `<h3>${esc(i[0])}</h3><div class="infobody">${infoHtml(i[1])}${more}${valueNow(key)}</div>`; document.getElementById('modal').classList.add('open'); }
function markerRows(rows){
  let out='', grp='';
  rows.forEach(r=>{ if(r.group!==grp){ grp=r.group; const [gn, gs] = grp.split(' · '); out+=`<div class="grp info" onclick="showInfo('${esc(gn)}')">${esc(gn)}${gs?` <span class="gsub">(${esc(gs)})</span>`:''}</div>`; }
    let dl='–', cls='';
    if(r.delta!=null && r.delta!==0){ const good = r.lower_better ? r.delta<0 : r.delta>0; cls = good?'up':'dn'; dl=(r.delta>0?'+':'')+nl(r.delta, Number.isInteger(r.delta)?0:1); }
    else if(r.delta===0) dl='0';
    const val = r.txt!=null ? r.txt : (r.value==null ? '—' : (Number.isInteger(r.value)? r.value : nl(r.value, r.unit==='°C'?2:1)));
    MROWS[r.key||r.name] = r;
    out+=`<li class="${r.status} info" onclick="showInfo('${esc(r.key||r.name)}')">${SRC[r.src]||''}<div class="n">${esc(r.name)}${r.sub?`<span>${esc(r.sub)}</span>`:''}</div><div class="v"><span class="num">${val}</span><small>${r.unit?esc(r.unit):''}</small></div><div class="dl ${cls}">${dl}</div></li>`; });
  return `<ul class="trk">${out}</ul>`;
}

let CI = null; let CI_DAY = null; let CI_UNLOCK = false;

  const m = D.markers; const w = m.wellness || {}; const pw = m.wellness_prev || {}; const prev = D.today_block.coach || {};

let FB = Object.assign({}, LS.get('pt_fb', {})); let FB_OPEN = {}; let FB_TIMER = null;
const FB_ICO = {up:'<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9h3zm2 0l3.5-7a2 2 0 0 1 2 2v4h4.5a2 2 0 0 1 2 2.3l-1.2 6.5A2 2 0 0 1 17.8 20H9v-9z"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M17 13V4h3v9h-3zm-2 0l-3.5 7a2 2 0 0 1-2-2v-4H5a2 2 0 0 1-2-2.3l1.2-6.5A2 2 0 0 1 6.2 4H15v9z"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z"/></svg>'};
function fbGet(t){ return FB[t] || (D && D.feedback && D.feedback[t]) || {}; }
function fbBar(t){ return `<div class="fb" data-t="${esc(t)}">${fbInner(t)}</div>`; }
function fbInner(t){ const f = fbGet(t); const open = FB_OPEN[t] || (!!f.text && !FB_OPEN.hasOwnProperty(t) && false);
  return `<span class="fbl">Nuttig?</span><span class="fbb ${f.vote===1?'on':''}" onclick="fbVote('${t}',1)" title="Nuttig">${FB_ICO.up}</span><span class="fbb ${f.vote===-1?'on dn':''}" onclick="fbVote('${t}',-1)" title="Niet nuttig">${FB_ICO.down}</span><span class="fbb ${f.text?'on':''}" onclick="fbText('${t}')" title="Opmerking">${FB_ICO.chat}</span>
  ${open?`<textarea class="inp fbt" placeholder="Wat had de coach beter kunnen zeggen? Bijv. 'korter', 'geen citaten', 'meer feiten', 'herhaling'." oninput="fbNote('${t}',this.value)" onblur="fbSave()">${esc(f.text||'')}</textarea><div class="fbrow"><span class="small" id="fbs-${esc(t).replace(/[^a-z0-9]/gi,'_')}">${f.saved?'Opgeslagen ✓':'Nog niet opgeslagen'}</span><button class="btn mini" onclick="fbCommit('${t}')">Opslaan</button></div>`:(f.text?`<span class="fbq">“${esc(f.text)}”</span>`:'')}`; }
async function fbCommit(t){ const f = Object.assign({}, fbGet(t)); f.at = new Date().toISOString(); FB[t] = f; LS.set('pt_fb', FB); clearTimeout(FB_TIMER); const ok = await fbSave(); if(ok){ FB[t].saved = true; FB_OPEN[t] = false; fbRefresh(t); toast('Opmerking opgeslagen'); } }
function fbRefresh(t){ document.querySelectorAll(`.fb[data-t="${CSS.escape(t)}"]`).forEach(el=>{ el.innerHTML = fbInner(t); }); }
function fbVote(t, v){ const f = Object.assign({}, fbGet(t)); f.vote = (f.vote===v) ? 0 : v; f.at = new Date().toISOString(); FB[t] = f; LS.set('pt_fb', FB); fbRefresh(t); fbQueue(); }
function fbText(t){ FB_OPEN[t] = !FB_OPEN[t]; fbRefresh(t); if(FB_OPEN[t]){ const ta = document.querySelector(`.fb[data-t="${CSS.escape(t)}"] textarea`); if(ta) ta.focus(); } }
function fbNote(t, txt){ const f = Object.assign({}, fbGet(t)); f.text = txt; f.at = new Date().toISOString(); f.saved = false; FB[t] = f; LS.set('pt_fb', FB); const el=document.getElementById('fbs-'+t.replace(/[^a-z0-9]/gi,'_')); if(el) el.textContent='Nog niet opgeslagen'; fbQueue(1500); }
function fbQueue(ms){ clearTimeout(FB_TIMER); FB_TIMER = setTimeout(fbSave, ms||400); }
async function fbSave(){ try{ await api('PUT','/input',{day:new Date().toISOString().slice(0,10), kind:'feedback', data:{items: FB}}); Object.keys(FB).forEach(k=>{ FB[k].saved = true; }); LS.set('pt_fb', FB); if(D){ D.feedback = Object.assign({}, D.feedback||{}, FB); LS.set('pt_snapshot', D); } document.querySelectorAll('[id^=fbs-]').forEach(el=>el.textContent='Opgeslagen ✓'); return true; }catch(e){ toast('Beoordeling niet opgeslagen, probeer opnieuw'); return false; } }
const FUEL_LBL = {voor:'Vóór', tijdens:'Tijdens', na:'Na', avond:'Vanavond', dag:'De dag'};
function fuelBlock(r){
  const v = r && r.voeding; if(!v || !v.titel) return '';

}
function coachToday(c){

function coachCard(prev){

    ${prev.generated_at?`<div class="small">Gemaakt ${esc(String(prev.generated_at).replace('T',' ').slice(0,16))}</div>`:''}${fbBar('daily:'+prev.day)}</div>`;

let CI_STATUS = 'Wordt automatisch opgeslagen.'; let CI_TIMER = null;

  return `<div class="hdr"><h1>Vandaag</h1><span class="date">${esc(D.timeline.today_txt)} <span class="gear" onclick="requestRefresh()" title="Verversen">${REFRESHING?'⟳':'↻'}</span></span></div>

const syncT = x => x ? new Date(x).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) : '–';
function syncLine(style){ const m=D.markers.sync||{}; const watch = m.watch ? ` · horloge ${syncT(m.watch)}` : ''; return `<div class="small" style="text-align:center;${style||''}">Laatste sync · Oura ${syncT(m.oura)} <span style="color:var(--green)">✓</span> · Garmin ${syncT(m.garmin)} <span style="color:var(--green)">✓</span>${watch}</div>`; }
function stopwatch(x){ return `<div class="sw"><svg viewBox="0 0 24 26"><path d="M10 1.5h4M12 1.5v2.5M18.5 6l1.5-1.5"/><circle cx="12" cy="14" r="9.5"/><text x="12" y="17.2" text-anchor="middle">${x.minutes}</text></svg><span>${x.km?`<b>${nl(x.km)} KM</b>`:''}</span></div>`; }
function reviewLine(x){ const r=x.result; if(!r||!r.review) return ''; const first = r.review.split(/(?<=[.!?])\s+/).slice(0,2).join(' '); return `<span class="rev">${esc(first)}</span>`; }
function resultLine(x){ const r=x.result; if(!r) return ''; const parts=[]; if(r.distance_km) parts.push(nl(r.distance_km)+' km'); parts.push(r.duration); if(r.pace) parts.push(r.pace); if(r.avg_hr) parts.push('HR '+Math.round(r.avg_hr)+(r.max_hr?' / max '+Math.round(r.max_hr):'')+(r.hr_source==='wrist'?' (pols)':'')); if(r.self_effort) parts.push('zwaarte '+r.self_effort+'/10'); if(r.self_feel) parts.push('gevoel '+r.self_feel+'/5'); return `<span style="color:var(--green);font-weight:600">✓ ${esc(parts.join(' · '))}</span>`; }
function gymTable(rows){

function chart(series, opts){
  // series: [{pts:[{x:Date,y:number}], cls, dash, dots, color}], opts: {y0,y1, yfmt, band:[lo,hi]}
  const W=340, H=130, pl=34, pr=8, pt=8, pb=20; const xs = series.flatMap(s=>s.pts.map(p=>+p.x)); const x0 = opts.x0 ? +opts.x0 : Math.min(...xs), x1 = opts.x1 ? +opts.x1 : Math.max(...xs);
  const ys = series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null); let y0 = opts.y0 ?? Math.min(...ys), y1 = opts.y1 ?? Math.max(...ys); if(y1===y0){ y1=y0+1; }
  const X = x => pl + (x1===x0?0:(+x-x0)/(x1-x0))*(W-pl-pr), Y = y => pt + (1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [y0, (y0+y1)/2, y1].forEach(v=>{ g += `<text x="2" y="${Y(v)+3}" font-size="9" fill="var(--ink3)">${opts.yfmt?opts.yfmt(v):nl(v,0)}</text><line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/>`; });
  if(opts.band){ const [lo,hi]=opts.band; g += `<rect x="${pl}" y="${Y(hi)}" width="${W-pl-pr}" height="${Math.max(0,Y(lo)-Y(hi))}" fill="var(--e-bg)" opacity=".8"/>`; }
  series.forEach(s=>{ const pts = s.pts.filter(p=>p.y!=null && +p.x>=x0 && +p.x<=x1); if(!pts.length) return;
    if(s.dots){ g += pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${s.r||2.6}" fill="${s.color}"/>`).join(''); }
    else g += `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ')}"/>`; });
  const lab = d => new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
  g += `<text x="${pl}" y="${H-6}" font-size="9" fill="var(--ink3)">${lab(x0)}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="var(--ink3)" text-anchor="end">${lab(x1)}</text></svg>`;
  return g;
}

function remInit(){ if(REM) return; REM = ((D.push && D.push.reminders) || []).map(r=>Object.assign({}, r)); }
function remAdd(){ remInit(); REM.push({id:'r'+Date.now().toString(36), time:'20:30', text:'Geen avondsnack: een glas water of thee, en de keuken dicht.', days:[], on:true}); render(); remQueue(); }
function remDel(id){ REM = REM.filter(r=>r.id!==id); render(); remQueue(); }
function remSet(id, k, v){ const r = REM.find(x=>x.id===id); if(!r) return; r[k] = v; if(k!=='text' && k!=='time') render(); remQueue(); }   // tijd en tekst niet opnieuw tekenen: dat sluit de iOS-tijdkiezer
function remDay(id, d){ const r = REM.find(x=>x.id===id); if(!r) return; r.days = r.days||[]; r.days = r.days.includes(d) ? r.days.filter(x=>x!==d) : r.days.concat([d]); render(); remQueue(); }
function remQueue(){ clearTimeout(REM_TIMER); REM_TIMER = setTimeout(remSave, 900); }
async function remSave(){ try{ await api('PUT','/input',{day:new Date().toISOString().slice(0,10), kind:'reminders', data:{items: REM}}); if(D.push){ D.push.reminders = REM.map(r=>Object.assign({}, r)); LS.set('pt_snapshot', D); } const el=document.getElementById('rem-status'); if(el) el.textContent='Opgeslagen ✓ · de server verstuurt op de ingestelde tijd'; }catch(e){ toast('Opslaan mislukt'); } }
function vReminders(){
  remInit(); if(PUSH_STATE===null){ PUSH_STATE = {}; pushStatus().then(s=>{ PUSH_STATE = s; render(); }); }
  const s = PUSH_STATE || {};
  let st;
  if(s.ok===false) st = `<div class="muted">${esc(s.why)}</div>`;
  else if(s.perm==='granted' && s.subscribed) st = `<div class="setrow"><div><b>Meldingen</b><span style="color:var(--green)">ingeschakeld op dit apparaat${D.push&&D.push.subscriptions?` · ${D.push.subscriptions} apparaat${D.push.subscriptions===1?'':'en'} bekend bij de server`:''}</span></div><span class="muted" onclick="pushTest()" style="cursor:pointer">test</span></div>`;
  else if(s.perm==='denied') st = `<div class="muted">Meldingen zijn geweigerd voor deze app. Zet ze aan via iPhone-instellingen → Meldingen → Trainer, en kom dan terug.</div>`;
  else st = `${s.standalone===false?'<div class="muted" style="margin-bottom:8px">Op de iPhone werken meldingen alleen vanuit de app op het beginscherm (Deel → Zet op beginscherm).</div>':''}<button class="btn" onclick="pushEnable()">Meldingen inschakelen</button>`;
  const rows = REM.map(r=>`<div class="card rem"><div class="setrow" style="border:0;padding:0 0 6px"><input type="time" class="inp tm" value="${esc(r.time||'20:30')}" onchange="remSet('${r.id}','time',this.value)"><span class="toggle ${r.on?'':'off'}" onclick="remSet('${r.id}','on',${r.on?'false':'true'})"></span></div>
    <textarea class="inp" style="min-height:56px" placeholder="Tekst van de melding" oninput="remSet('${r.id}','text',this.value)">${esc(r.text||'')}</textarea>
    <div class="chips" style="padding:8px 0 4px">${DAYS_NL.map(d=>`<span class="${(r.days||[]).length===0||(r.days||[]).includes(d)?'on':''}" onclick="remDay('${r.id}','${d}')">${d}</span>`).join('')}</div>
    <div class="small" style="display:flex;justify-content:space-between"><span>${(r.days||[]).length===0?'elke dag':'alleen op de gekozen dagen'}</span><span style="color:var(--red);cursor:pointer" onclick="remDel('${r.id}')">verwijderen</span></div></div>`).join('');
  const last = (D.push && D.push.last && D.push.last[0]) ? `<div class="small" style="margin-top:6px">Laatst verstuurd: ${esc(String(D.push.last[0].sent_at).replace('T',' ').slice(0,16))}</div>` : '';
  return `<div class="hdr"><h1>Herinneringen</h1><span class="d" onclick="goTab('menu')" style="cursor:pointer">← menu</span></div>
  <div class="card">${st}${last}</div>
  ${rows}
  <button class="btn ghost" onclick="remAdd()">+ Herinnering toevoegen</button>
  <div class="small" id="rem-status" style="margin:8px 0 10px;text-align:center">De server (altijd aan) verstuurt de melding op de ingestelde tijd, ook als de app dicht is.</div>`;
}
function vMeer(){
  const z = D.zones; const t = D._updated ? new Date(D._updated).toLocaleString('nl-NL',{weekday:'short',hour:'2-digit',minute:'2-digit'}) : '–';
  return `<div class="hdr"><h1>Instellingen</h1><span class="d" onclick="goTab('menu')" style="cursor:pointer">← menu</span></div>
  <div class="card"><div class="setrow"><div><b>Synccode</b><span>${esc(CODE.slice(0,7))}••••-••••</span></div><span class="muted" onclick="LS.set('pt_code','');CODE='';renderSetup()" style="cursor:pointer">wijzigen</span></div>
  <div class="setrow"><div><b>Laatste snapshot</b><span>${esc(t)} · gegenereerd ${esc(D.generated_at||'')}</span></div><span class="muted" onclick="load()" style="cursor:pointer">vernieuwen</span></div>
  <div class="setrow"><div><b>Coach-afstemming</b><span>${(D.today_block.coach&&D.today_block.coach.prefs)?`${D.today_block.coach.prefs.n} beoordelingen · ${(D.today_block.coach.prefs.notes||[]).join(', ')||'geen aanpassingen'}`:'nog geen beoordelingen'}</span></div></div>
  <div class="setrow"><div><b>App-versie</b><span>${esc(BUILD==='20261019-1425'?'lokaal':BUILD)}</span></div><span class="muted" onclick="applyUpdate()" style="cursor:pointer">vernieuwen</span></div>
  <div class="setrow"><div><b>Donkere modus</b><span>${LS.get('pt_theme','dark')==='dark'?'aan · standaard':'uit · lichte modus'}</span></div><span class="toggle ${LS.get('pt_theme','dark')==='dark'?'':'off'}" onclick="themeToggle()"></span></div></div>
  <div class="card"><h2>Zones · maximum ${z.hrmax}</h2><ul class="list"><li><div class="li-main"><b>Rustig</b><span>${z.easy[0]}–${z.easy[1]} · plafond 155 · 7:00–7:45</span></div></li><li><div class="li-main"><b>Drempel</b><span>${z.threshold[0]}–${z.threshold[1]} · 5:50–6:05</span></div></li><li><div class="li-main"><b>Noorse 4×4</b><span>${z['4x4'][0]}–${z['4x4'][1]} · herstel ~135</span></div></li><li><div class="li-main"><b>Wedstrijdtempo</b><span>${z.race[0]}–${z.race[1]} · 5:45–6:00</span></div></li></ul></div>
  <div class="card"><h2>Gymregels</h2><ul style="margin:0;padding-left:16px;font-size:13px;line-height:1.5">${D.gym_rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Bronnen</h2><div class="muted">Oura: nacht-HRV, laagste HR, slaap, temperatuur, ademfrequentie. Garmin: borstband-hartslag, tempo, workouts, stappen, trappen, water, weegschaal, zelfevaluatie. Protocol: Nuuttila 2022 / Vesterinen 2016. Data staan alleen achter uw synccode.</div></div>`;
}
function setTheme(t){ t = t==='light' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); LS.set('pt_theme', t); document.querySelectorAll('meta[name=theme-color]').forEach(m=>{ m.removeAttribute('media'); m.content = t==='dark' ? '#000000' : '#F4F5F8'; }); }
function themeToggle(){ setTheme(LS.get('pt_theme','dark')==='dark' ? 'light' : 'dark'); render(); }
setTheme(LS.get('pt_theme', 'dark'));
// ---- schil op de echte vensterhoogte: iOS rekent de viewport bij het starten en na het inklappen van de browserbalk soms verkeerd,
//      en een vaste container ter grootte van de viewport laat dan een zwarte strook onderin staan (WebKit-bug in iOS 26); daarom meten ----
function fitShell(){ const h = window.innerHeight; if(h > 200) document.documentElement.style.setProperty('--vh', h + 'px'); }
fitShell(); ['resize','orientationchange','pageshow','focus'].forEach(e=>window.addEventListener(e, fitShell));
if(window.visualViewport) visualViewport.addEventListener('resize', fitShell);
document.addEventListener('visibilitychange', fitShell); [150, 500, 1200, 3000, 6000].forEach(ms=>setTimeout(fitShell, ms));
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
// ---- nieuwe versie van de app opmerken (de ↻-knop ververst alleen de data) ----
const BUILD = '20261019-1425'; let UPDATE_SEEN = false;
async function checkUpdate(){
  if(BUILD === '20261019-1425' || UPDATE_SEEN) return;
  try{ const r = await fetch('index.html?u='+Date.now(), {cache:'no-store'}); const txt = await r.text(); const m = txt.match(/app-build" content="([^"]+)"/);
    if(m && m[1] !== BUILD){ UPDATE_SEEN = true;
      // automatisch bijwerken zodra dat veilig is (niets aan het opslaan of genereren, geen open invoerveld); anders de balk tonen
      const busy = CI_TIMER || FB_TIMER || REM_TIMER || COACHING || REFRESHING || (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) || document.getElementById('modal').classList.contains('open');
      if(!busy){ try{ LS.set('pt_updated_toast', 1); }catch(e){} applyUpdate(); return; }
      const el = document.getElementById('upd'); el.classList.add('on'); } }catch(e){}
}
async function applyUpdate(){ try{ if('serviceWorker' in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); } const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){} location.reload(); }
checkUpdate(); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(); }); setInterval(checkUpdate, 15*60*1000);
try{ if(LS.get('pt_updated_toast', 0)){ LS.set('pt_updated_toast', 0); setTimeout(()=>toast('App bijgewerkt naar versie '+BUILD), 800); } }catch(e){}
load();
</script>
</body>
</html>
